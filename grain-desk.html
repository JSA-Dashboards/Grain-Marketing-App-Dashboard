<title>Grain Marketing Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: app bar + farm header + tabbed work area; summary strip first, detail tables below */
:root{
  --bg:#D6E5CF; --surface:#FFFFFF; --soft:#E6EFE1; --line:#C9D7C2;
  --ink:#17201A; --muted:#5A675E;
  --accent:#1D6A4D; --accent-ink:#FFFFFF; --grain:#B5862B;
  --good:#2C7A4C; --warn:#A86A12; --bad:#AE3D2B;
  --c-corn:#C99A06; --c-soy:#4F8A2B; --c-wheat:#A8702F;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1A11; --surface:#192019; --soft:#232C25; --line:#2E3830;
  --ink:#E4EBE5; --muted:#99A69C;
  --accent:#5FBC90; --accent-ink:#0C1810; --grain:#D9AF57;
  --good:#6BC38F; --warn:#E2A94B; --bad:#E57B66;
  --c-corn:#E7BC3A; --c-soy:#86C25E; --c-wheat:#D59C5A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1A11; --surface:#192019; --soft:#232C25; --line:#2E3830;
  --ink:#E4EBE5; --muted:#99A69C;
  --accent:#5FBC90; --accent-ink:#0C1810; --grain:#D9AF57;
  --good:#6BC38F; --warn:#E2A94B; --bad:#E57B66;
  --c-corn:#E7BC3A; --c-soy:#86C25E; --c-wheat:#D59C5A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{font-family:var(--f-display);font-stretch:88%;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:780}
h2{font-size:1.15rem;font-weight:720}
h3{font-size:.95rem;font-weight:700}
.num,td.n,.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

.bar{display:flex;align-items:center;gap:12px;padding-block:14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-family:var(--f-display);font-stretch:112%;font-weight:800;font-size:.95rem;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand svg{color:var(--grain)}
.bar .sp{flex:1}
.who{font-size:.85rem;color:var(--muted)}

.banner{margin-top:14px;padding:10px 14px;border-radius:var(--r);background:var(--soft);font-size:.88rem}
.farmhead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-block:22px 6px}
.farmhead .sp{flex:1}
.crumb{font-size:.85rem;margin-bottom:4px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin-top:10px}
.tab{appearance:none;border:0;background:none;font:600 .92rem var(--f-body);color:var(--muted);padding:10px 14px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

button,.btn{font:600 .88rem var(--f-body);border-radius:var(--r);padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600}
button.danger{color:var(--bad)}
button.small{padding:4px 10px;font-size:.8rem}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;width:100%}

section{margin-top:26px}
.sechead{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.sechead .sp{flex:1}

.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:20px}
.stat{background:var(--surface);padding:14px 16px;min-width:0}
.stat .v{font-family:var(--f-data);font-size:1.45rem;font-weight:500;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .s{font-size:.8rem;color:var(--muted)}
@media (max-width:720px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th.n,td.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{color:var(--ink);display:block;font-family:var(--f-display);font-size:1.05rem;margin-bottom:4px}

.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;border:1px solid currentColor}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.neutral{color:var(--muted)}
.pill.solid{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* marketing position bars */
.pos{padding:12px 0 0}
.posrow{display:grid;grid-template-columns:140px minmax(0,1fr) 210px;gap:16px;align-items:center;padding-block:14px;border-bottom:1px solid var(--line)}
.posrow:last-child{border-bottom:0}
.posrow .crop{font-family:var(--f-display);font-weight:720;font-size:1.02rem}
.track{position:relative;height:22px;background:var(--soft);border-radius:3px;display:flex;overflow:visible}
.seg{height:100%}
.seg.sold{background:var(--accent);border-radius:3px 0 0 3px}
.seg.hedged{background:var(--grain)}
.ins{position:absolute;top:-5px;bottom:-5px;width:0;border-left:2px dashed var(--ink)}
.ins span{position:absolute;top:-18px;left:-1px;transform:translateX(-50%);font-size:.66rem;white-space:nowrap;color:var(--muted)}
.posfacts{font-size:.8rem;display:grid;grid-template-columns:auto auto;gap:2px 10px}
.posfacts dt{color:var(--muted)} .posfacts dd{margin:0;text-align:right;font-family:var(--f-data)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);padding:12px 18px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
@media (max-width:760px){.posrow{grid-template-columns:minmax(0,1fr)}.posrow .track{margin-top:14px}}

.alerts{list-style:none;margin:0;padding:0}
.alerts li{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.alerts li:last-child{border-bottom:0}
.alerts .dot{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px}
.dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)} .dot.neutral{background:var(--muted)}

.binbar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;min-width:90px}
.binbar div{height:100%;background:var(--accent)}
.binbar div.over{background:var(--bad)}

.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}

dialog{border:1px solid var(--line);border-radius:10px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,20,14,.45)}
dialog form{padding:20px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-top:14px}
.fgrid .full{grid-column:1/-1}
.fgrid label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted)}
.fgrid .hint{font-weight:400;font-size:.74rem}
@media (max-width:480px){.fgrid{grid-template-columns:1fr}}
.dlgfoot{display:flex;gap:10px;margin-top:18px;align-items:center}
.dlgfoot .sp{flex:1}

.explain{max-width:85ch;font-size:.82rem;color:var(--muted);margin-top:12px;display:grid;gap:6px}
.explain p{margin:0} .explain b{color:var(--ink)}
tfoot td{border-top:1px solid var(--line);border-bottom:0;background:var(--soft)}
/* home screen */
.hometiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-top:20px}
.htile{display:grid;gap:6px;align-content:start;text-align:left;padding:22px 20px;border-radius:16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;
  transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease;min-height:180px}
.htile:hover{border-color:var(--accent);box-shadow:0 6px 18px rgba(20,60,35,.12);transform:translateY(-2px)}
.hicon{width:38px;height:38px;color:var(--accent);padding:7px;border-radius:10px;background:color-mix(in srgb,var(--accent) 12%,var(--surface));margin-bottom:6px}
.htitle{font:750 1.2rem var(--f-display)}
.hdesc{font-size:.85rem;color:var(--muted);line-height:1.4}
.hstat{margin-top:auto;padding-top:10px;font-size:.88rem;color:var(--ink);font-variant-numeric:tabular-nums}
.htile[data-section="weather"] .hicon,.htile[data-section="intel"] .hicon{color:var(--muted);background:var(--soft)}
@media (prefers-reduced-motion:reduce){.htile{transition:none}.htile:hover{transform:none}}
/* production calculator */
.calc{padding:22px 24px;border-radius:14px}
.clab{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.chip{border-radius:999px;padding:8px 18px;font:600 .95rem var(--f-body);border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.chip.add{color:var(--muted);border-style:dashed}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 18px}
@media (min-width:900px){.pgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pf{display:flex;flex-direction:column;gap:6px;min-width:0}
.pf span{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf input{font:500 1.2rem var(--f-data);padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);font-variant-numeric:tabular-nums}
.pf input:focus{border-color:var(--accent)}
.beresult{margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}
.bebig{font:800 3.4rem/1.05 var(--f-display);color:var(--accent);text-align:center;font-variant-numeric:tabular-nums;margin-top:4px}
.bestats,.mkt{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:16px}
.bestats>div,.mkt>div{background:var(--surface);padding:10px 14px;display:grid;gap:3px}
.bestats span,.mkt span{font-size:.72rem;color:var(--muted)}
.bestats b,.mkt b{font:600 1.05rem var(--f-data);font-variant-numeric:tabular-nums}
.mkt>div.p-gain{background:color-mix(in srgb,var(--good) 16%,var(--surface))}
.mkt>div.p-loss{background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
@media (max-width:480px){.calc{padding:18px 16px}.bebig{font-size:2.8rem}}
.mkt>div.p-warn{background:color-mix(in srgb,var(--warn) 16%,var(--surface))}
.chip.sm{padding:5px 12px;font-size:.82rem}
/* storage: bin cards */
.bingrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
/* grain bin fans */
.fans .fanctl{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.fantgt{display:flex;align-items:center;gap:10px}.fantgt span{color:var(--muted);font-size:.88rem}.fantgt b{font-size:1.15rem;min-width:4.2ch;text-align:center;font-variant-numeric:tabular-nums}
.fantgt button{min-width:36px}
.fanstat{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-top:16px;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--soft)}
.fanstat>div{display:grid;gap:2px}.fanstat b{font-size:1.15rem;font-weight:780;letter-spacing:.02em}.fanstat span{font-size:.84rem;color:var(--muted)}
.fanstat .fanemc{text-align:right}.fanstat .fanemc b{font-size:1.5rem;font-variant-numeric:tabular-nums}
.fanstat.on{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface))}.fanstat.on>div:first-child b{color:var(--good)}
.fanstat.cool{border-color:var(--grain);background:color-mix(in srgb,var(--grain) 10%,var(--surface))}.fanstat.cool>div:first-child b{color:var(--warn)}
.fanstat.off{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--surface))}.fanstat.off>div:first-child b{color:var(--bad)}
.fanwins{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:6px}
.fanwins li{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:baseline;font-size:.92rem}
.fanwins .fanico{font-size:1.05rem;line-height:1}.fanwins li.on .fanico{color:var(--good)}.fanwins li.cool .fanico{color:var(--grain)}
.fanstrip{display:grid;grid-template-columns:repeat(36,1fr);gap:2px;height:22px}.fanstrip i{border-radius:3px;background:var(--line)}
.fanstrip i.on,.fanleg i.on{background:var(--good)}.fanstrip i.cool,.fanleg i.cool{background:var(--grain)}.fanstrip i.off,.fanleg i.off{background:color-mix(in srgb,var(--bad) 55%,var(--surface))}
.fanaxis{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);margin-top:3px}
.fanleg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.74rem;color:var(--muted);margin-top:8px}.fanleg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
@media (max-width:520px){.fanstat{flex-direction:column;align-items:flex-start}.fanstat .fanemc{text-align:left}}
.bincard2{padding:16px 18px;border-radius:14px;border-top:4px solid var(--crop)}
.bc2head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.bc2head b{font-family:var(--f-display);font-size:1.05rem}
.pgrid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pgrid3 .pf input{font-size:1rem;padding:8px 10px}
/* contract scanning */
.fgrid label.flag input,.fgrid label.flag select{border:2px solid var(--warn);background:color-mix(in srgb,var(--warn) 8%,var(--surface))}
.scanbox,.scannote{display:flex;gap:14px;align-items:center;margin-top:12px}
.scanbox img,.scannote img{width:96px;height:120px;object-fit:cover;border-radius:8px;border:1px solid var(--line);flex:none}
.scannote{padding:10px;border-radius:10px;background:var(--soft)}
.scannote img{width:64px;height:80px}
.cphoto{display:flex;gap:12px;align-items:center;margin-top:14px;padding:10px;border:1px solid var(--line);border-radius:10px}
.cphoto img{width:72px;height:90px;object-fit:cover;border-radius:6px;display:block}
/* deadlines to watch */
.dllist{list-style:none;margin:0;padding:6px 0}
.dllist li{display:flex;gap:14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.dllist li:last-child{border-bottom:0}
.dlbadge{flex:none;width:70px;text-align:center;border-radius:8px;padding:6px 4px;background:color-mix(in srgb,var(--accent) 12%,var(--surface));display:grid;gap:1px}
.dlbadge b{font:700 .95rem var(--f-display);color:var(--accent)}
.dlbadge span{font:500 .78rem var(--f-data);color:var(--muted)}
.dlbadge.soon{background:color-mix(in srgb,var(--warn) 16%,var(--surface))}
.dlbadge.soon b{color:var(--warn)}
.dltext{display:grid;gap:2px;min-width:0}
.dltext b{font-weight:600}
.dltext span{font-size:.8rem;color:var(--muted)}
/* budget vs actual, year over year */
table.bva td:first-child{white-space:nowrap}
table.bva tr.grp td{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;font-weight:600;padding-top:14px;padding-bottom:6px}
.yoybars{display:flex;gap:18px;align-items:flex-end;padding:16px 16px 4px;flex-wrap:wrap}
.yb{display:grid;gap:4px;justify-items:center}
.ybars{display:flex;gap:3px;align-items:flex-end;height:90px}
.ybars .b{width:16px;border-radius:3px 3px 0 0;min-height:2px}
.ybars .be{background:var(--muted)} .ybars .av{background:var(--accent)}
.yl{font-size:.75rem;color:var(--muted)}
/* break-even detail */
.bed{padding:14px 16px}
.bebar{display:flex;height:22px;border-radius:4px;overflow:hidden;gap:2px;background:var(--surface)}
.bebar div{min-width:3px}
table.costtab{margin-top:12px;font-size:.85rem}
table.costtab td{padding:4px 6px}
table.costtab input,table.costtab select{padding:5px 7px;font-size:.85rem}
table.costtab input.num{width:96px;text-align:right}
table.costtab td:first-child{min-width:170px}
dialog:has(.costtab){width:min(760px,calc(100vw - 32px))}
/* intel */
.intelgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start;margin-top:20px}
@media (max-width:900px){.intelgrid{grid-template-columns:minmax(0,1fr)}}
.ipost{padding:16px 18px;border-radius:14px;margin-top:12px}
.ipost.pinned{border-left:4px solid var(--grain)}
.ipmeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ipost h3{font-size:1.15rem;margin:8px 0 6px}
.ipbody{line-height:1.55;max-width:72ch}
.ipbody.clamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.ipfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.tag.icat{background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent)}
.tag.icat[data-cat="Action item"]{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--bad)}
.tag.icat[data-cat="Weather"]{background:color-mix(in srgb,var(--c-soy) 16%,var(--surface));color:var(--c-soy)}
.tag.icat[data-cat="Policy & programs"]{background:color-mix(in srgb,var(--grain) 16%,var(--surface));color:var(--warn)}
.draftbox{margin-top:12px;padding:12px;border-radius:10px;background:var(--soft)}
.draftbox textarea,#ip_body{font:inherit;width:100%}
/* quotes: board styled after the reference app */
.qhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:26px 0 12px;padding-left:12px;border-left:4px solid var(--accent)}
.qhead h2{font-size:1.35rem;font-weight:800;text-transform:uppercase;letter-spacing:.01em}
.qhead span{display:block;font-size:.85rem;color:var(--muted);margin-top:2px}
.qex{color:var(--accent);font-family:var(--f-display);font-size:1rem}
.qboard{border-radius:16px;padding:4px 18px}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) 110px minmax(90px,auto);gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}
.qrow>div:first-child b{display:block;font-size:1.08rem;font-weight:650}
.qrow>div:first-child span{font-size:.85rem;color:var(--muted)}
.qrow.bid{grid-template-columns:minmax(0,1fr) 0 auto}
.qpx{text-align:right;display:grid;gap:2px}
.qpx b{font:600 1.2rem var(--f-data);font-variant-numeric:tabular-nums}
.qpx span{font:500 .88rem var(--f-data);color:var(--muted)}
.qpx .up{color:var(--good)} .qpx .dn{color:var(--bad)}
.spark{width:110px;height:30px;display:block}
.spark polyline{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.qnote{font-size:.8rem;color:var(--muted);padding:12px 0}
@media (max-width:480px){.qrow{grid-template-columns:minmax(0,1fr) 72px auto;gap:10px}.spark{width:72px}}
/* quotes: futures board */
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}

<script>
// 'Put option' is the stored value for Premium Plus: a sold call that adds premium to the contract and doubles the bushels if futures settle at or above the strike
const CONTRACT_TYPES=['Cash sale','Forward contract','HTA','Basis contract','Accumulator','Put option','Min/Max','Other'];
const HEDGE_TYPES=['Futures hedge'];
const SALE_TYPES=[...CONTRACT_TYPES,...HEDGE_TYPES];
const DELIVERABLE=['Forward contract','HTA','Basis contract','Accumulator','Put option','Min/Max','Other'];
// Other / specialty: a named contract with free-form terms; priced by a known flat price, or futures + basis
const isOther=s=>s.type==='Other';
// Min/Max: futures price ends up held between a floor and a ceiling, less any net fee
const isMM=s=>s.type==='Min/Max';
const mmClamp=(s,v)=>v==null?null:Math.min(Math.max(v,num(s.minPrice)??-Infinity),num(s.maxPrice)??Infinity);
const isPP=s=>s.type==='Put option';
const ppDbl=s=>num(s.dblBu)??n0(s.bu);
const ppDoubled=s=>isPP(s)&&s.ppOutcome==='Doubled up';
// insurance figures stay off the Crop Overview and alerts until the Crop insurance tab is built out
const SHOW_INSURANCE=false;
const isAcc=s=>s.type==='Accumulator';
// display names; stored type values stay the same so existing records need no conversion
const TYPE_LABEL={'Forward contract':'Cash sale','Cash sale':'Spot','Put option':'Premium Plus','Other':'Other / specialty'};
const tl=t=>TYPE_LABEL[t]||t;
// a record's display name: specialty contracts show the name the producer gave them
const typeName=x=>isOther(x)&&x.specialtyName?x.specialtyName:tl(x.type);
const hasSource=s=>DELIVERABLE.includes(s.type)||s.type==='Cash sale';
const fromHarvest=s=>s.source==='Harvest';
const sourceLabel=s=>hasSource(s)?(fromHarvest(s)?'At harvest':'From bin'):'';
// committed bushels: for an accumulator only what has accumulated so far
const qty=s=>isAcc(s)?n0(s.accBu):n0(s.bu)+(ppDoubled(s)?ppDbl(s):0);
const INS_TYPES=['RP','RP-HPE','YP','None'];
const CROPS=['Corn','Soybeans','Wheat','Sorghum','Barley','Oats','Canola','Sunflowers'];
const SALE_CROPS=['Corn','Soybeans','Wheat'];
const TODAY=(d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10))(new Date());
const THIS_YEAR=new Date().getFullYear();
// JSA's required disclaimer (same wording as the JSA dashboards). Shown under every page and on every PDF.
// Change it here only; the hosted sign-in page has its own copy in hosted/server/app/main.py.
const DISCLAIMER=`Trading commodity futures, options on futures, cash commodities, and over-the-counter derivative products involves substantial risk of loss and may not be suitable for all investors. This communication is provided for informational purposes only and does not constitute investment advice, a recommendation, or an offer or solicitation to buy or sell any futures, options, cash commodities, or derivative products. John Stewart & Associates, Inc. does not accept orders to buy or sell any financial instruments via email. The information contained herein has been obtained from sources believed to be reliable; however, its accuracy and completeness are not guaranteed. Any opinions expressed are solely those of the author, are subject to change without notice, and should not be relied upon as a basis for investment decisions. Past performance is not indicative of future results. This message may contain confidential or proprietary information intended solely for the use of the designated recipient. © John Stewart & Associates, Inc. ${THIS_YEAR}`;
document.getElementById('disclaimer').textContent=DISCLAIMER;

const S={mode:'loading',admin:false,role:'',db:null,user:null,uid:null,owner:false,farms:{},current:null,tab:'overview',year:THIS_YEAR,note:'',names:{},
  section:'home',flt:{q:'',crop:'',type:'',buyer:'',status:'',month:'',source:''},sort:{k:'date',dir:-1},by:'crop',downloads:null,brokerF:''};
try{S.brokerF=localStorage.getItem('gd.brokerFilter')||''}catch(_){}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>(v===''||v==null||isNaN(+v))?null:+v;
const n0=v=>num(v)??0;
const bu=v=>Math.round(v).toLocaleString('en-US');
const usd=(v,d=2)=>v==null?'—':(v<0?'−$':'$')+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=v=>v==null||!isFinite(v)?'—':Math.round(v*100)+'%';
const uid=()=>Math.random().toString(36).slice(2,10);
const key=s=>String(s||'').trim().toLowerCase();
const fmtDate=d=>{if(!d)return '—';const t=new Date(d+'T12:00:00');return isNaN(t)?d:t.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})};
const daysUntil=d=>Math.round((new Date(d+'T12:00:00')-new Date(TODAY+'T12:00:00'))/864e5);
const clone=o=>JSON.parse(JSON.stringify(o));
function normalize(d){d=clone(d||{});return{name:d.name||'Unnamed farm',broker:d.broker||'',state:d.state||'',county:d.county||'',bidHome:d.bidHome||null,sample:!!d.sample,crops:d.crops||[],sales:d.sales||[],bins:d.bins||[],scenarios:d.scenarios||[],deadlines:d.deadlines||[],reportNote:d.reportNote||'',group:d.group||'',fans:d.fans||null,updatedAt:d.updatedAt||null}}
function toast(msg,err){const t=$('#toast');t.textContent=msg;t.className='toast'+(err?' err':'');t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,err?6000:1800)}

/* ---------- calculations ---------- */
// rolls (HTA and futures hedges): each roll moves the contract to a later futures month; the spread changes the
// futures price (new month minus old, e.g. +0.12 carry) and the elevator or broker charges a fee per bushel
const ROLLABLE=['HTA','Futures hedge'];
const rollSpread=s=>(s.rolls||[]).reduce((a,r)=>a+n0(r.spread),0);
const rollFees=s=>(s.rolls||[]).reduce((a,r)=>a+n0(r.fee),0);
// the futures price after all rolls and their fees (null until a futures price is set)
const rolledFutures=s=>num(s.price)==null?null:num(s.price)+rollSpread(s)-rollFees(s);
function flatPrice(s){const p=num(s.price),b=num(s.basis);
  if(s.type==='Cash sale'||s.type==='Forward contract')return p;
  if(s.type==='HTA')return(p!=null&&b!=null)?rolledFutures(s)+b:null;
  if(s.type==='Basis contract'||isAcc(s))return(p!=null&&b!=null)?p+b:null;
  if(isMM(s))return(p!=null&&b!=null)?mmClamp(s,p)-n0(s.mmFee)+b:null;
  if(isOther(s))return num(s.otherFlat)??((p!=null&&b!=null)?p+b:null);
  // Premium Plus: base bushels at contract price + premium; doubled bushels at the strike
  if(isPP(s)){if(p==null||b==null)return null;const base=n0(s.bu),d=ppDoubled(s)?ppDbl(s):0,st=num(s.strike)??p;
    return(base*(p+n0(s.premium))+d*st)/((base+d)||1)+b}
  return null}
function businessDays(a,b){let n=0;const d=new Date(a+'T12:00:00'),e=new Date(b+'T12:00:00');while(d<=e){const w=d.getDay();if(w&&w<6)n++;d.setDate(d.getDate()+1)}return n}

function position(f,year){

  f.sales.filter(s=>+s.year===+year).forEach(s=>{const k=key(s.crop);(rows[k]||(rows[k]={plan:null,crop:s.crop,sales:[]})).sales.push(s)});

const LISTS={deadline:'deadlines',sale:'sales',crop:'crops',ins:'crops',mkt:'crops',bin:'bins'};
let dlgCtx=null,detail=null;
function listSave(kind,id){return rec=>{const f=S.farms[S.current],list=LISTS[kind];
  f[list]=id?f[list].map(r=>r.id===id?rec:r):[...f[list],rec];if(rec.year)S.year=+rec.year;persist(S.current)}}
function saleSave(id){return rec=>{
  rec.loads=rec.loads||[];rec.pricing=rec.pricing||[];
  if(!id){if(num(rec.price)!=null)rec.pricing.push({id:uid(),date:rec.date,leg:legLabel(rec,'price'),value:rec.price,month:rec.futuresMonth||''});
    if(num(rec.basis)!=null)rec.pricing.push({id:uid(),date:rec.date,leg:'Basis',value:rec.basis})}
  if(rec.trackLoads&&DELIVERABLE.includes(rec.type))rec.status=remaining(rec)<=0?'Delivered':'Open';
  listSave('sale',id)(rec)}}
function openForm(kind,id,opts={}){
  const f=S.farms[S.current];const spec=FORMS[kind];
  const base=opts.base||(id&&LISTS[kind]?f[LISTS[kind]].find(r=>r.id===id):null);
  detail=opts.back?detail:null;
  dlgCtx={kind,id,base:base?clone(base):null,vals:opts.vals||(base?clone(base):spec.blank()),confirmDel:false,title:opts.title,back:opts.back||null,note:opts.note||'',flags:opts.flags||[],
    onSave:opts.onSave||(kind==='sale'?saleSave(id):listSave(kind,id)),
    onDelete:opts.onDelete||(id&&LISTS[kind]&&kind!=='ins'&&kind!=='mkt'?()=>{const l=LISTS[kind];f[l]=f[l].filter(r=>r.id!==id);persist(S.current)}:null)};
  drawForm();if(!$('#dlg').open)$('#dlg').showModal()}
function drawForm(){
  const {kind,id,vals}=dlgCtx;const spec=FORMS[kind];
  const val=(x)=>typeof x==='function'?x(vals):x;
  const buyers=[...new Set((S.farms[S.current]?.sales||[]).map(s=>s.buyer).filter(Boolean))];
  const months=['Mar','May','Jul','Sep','Dec','Jan','Nov','Aug'].flatMap(m=>[m+' '+String(S.year).slice(2),m+' '+String(S.year+1).slice(2)]);
  $('#dlgform').innerHTML=`<h2>${esc(dlgCtx.title||(id?'Edit ':'Add ')+spec.title.toLowerCase())}</h2>${dlgCtx.note||''}
  <div class="fgrid">${spec.fields.filter(f=>!f.show||f.show(vals)).map(f=>f.type==='check'
    ?`<label class="full check"><span><input id="f_${f.k}" name="${f.k}" type="checkbox" ${vals[f.k]?'checked':''}> ${esc(val(f.label))}</span>${f.hint?`<span class="hint">${esc(val(f.hint))}</span>`:''}</label>`
    :`<label class="${f.full?'full':''}${(dlgCtx.flags||[]).includes(f.k)?' flag':''}">${esc(val(f.label))}${f.req?' *':''}
    ${f.type==='select'?`<select id="f_${f.k}" name="${f.k}">${val(f.options).map(o=>{const[v,l]=Array.isArray(o)?o:[o,o];return`<option value="${esc(v)}" ${v===vals[f.k]?'selected':''}>${esc(l)}</option>`}).join('')}</select>`
    :`<input id="f_${f.k}" name="${f.k}" type="${f.type}" ${f.step?`step="${f.step}"`:''} ${f.list?`list="${f.list}"`:''} ${f.req?'required':''} value="${esc(vals[f.k]??'')}">`}
    ${val(f.hint)?`<span class="hint">${esc(val(f.hint))}</span>`:''}</label>`).join('')}</div>
  <datalist id="crops">${CROPS.map(c=>`<option value="${c}">`).join('')}</datalist>
  <datalist id="buyers">${buyers.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
  <datalist id="months">${months.map(c=>`<option value="${c}">`).join('')}</datalist>
  <div class="dlgfoot">${dlgCtx.onDelete?`<button type="button" class="danger" data-act="del">${dlgCtx.confirmDel?'Confirm delete':'Delete'}</button>`:''}<div class="sp"></div>
  <button type="button" data-act="cancel">Cancel</button><button class="primary" type="submit">Save</button></div>`}
$('#dlgform').addEventListener('input',e=>{
  const t=e.target;if(!t.name||!dlgCtx)return;dlgCtx.vals[t.name]=t.type==='checkbox'?t.checked:t.value;
  if(t.tagName==='SELECT'||t.type==='checkbox'||t.name==='expiration'||t.name==='ppExpiration'||t.name==='mmExpiration'){drawForm();const el=$('#f_'+t.name);el&&el.focus()}});
$('#dlgform').addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
  if(dlgCtx){
    if(act==='cancel'){dlgCtx.back?dlgCtx.back():$('#dlg').close()}
    if(act==='del'){if(!dlgCtx.confirmDel){dlgCtx.confirmDel=true;drawForm();return}
      const del=dlgCtx.onDelete;$('#dlg').close();del()}
    return}
  if(!detail)return;
  const f=S.farms[S.current],s=f.sales.find(x=>x.id===detail.sid);if(!s)return;
  const back=()=>showSale(s.id),sid=s.id;
  const live=fn=>rec=>{const cur=S.farms[S.current]&&S.farms[S.current].sales.find(x=>x.id===sid);if(!cur){toast('That contract was removed.',true);return}fn(cur,rec);persist(S.current)};
  if(act==='close')$('#dlg').close();
  if(act==='sale-edit')openForm('sale',s.id,{back});
  if(act==='sale-del'){if(!detail.confirmDel){detail.confirmDel=true;drawSale();return}
    if(s.photoId&&S.assets)S.assets.delete(s.photoId).catch(()=>{});// the contract photo goes with the contract
    f.sales=f.sales.filter(x=>x.id!==s.id);$('#dlg').close();persist(S.current)}
  if(act==='photo-add')pickPhoto(file=>attachPhoto(s.id,file));
  if(act==='photo-rm'){if(!detail.confirmPhoto){detail.confirmPhoto=true;drawSale();return}
    const id=s.photoId;delete s.photoId;detail.confirmPhoto=false;persist(S.current);drawSale();if(S.assets&&id)S.assets.delete(id).catch(()=>{})}
  if(act==='sale-price'){const leg=a.dataset.leg;
    openForm('price',null,{title:`Set ${leg} · ${s.crop} ${typeName(s).toLowerCase()}`,vals:{leg,date:TODAY,month:s.futuresMonth||''},back,
      onSave:live((s,rec)=>{if(leg==='basis')s.basis=rec.value;else s.price=rec.value;if(rec.month)s.futuresMonth=rec.month;
        s.pricing=[...(s.pricing||[]),{id:rec.id,date:rec.date,leg:leg==='basis'?'Basis':'Futures',value:rec.value,month:rec.month,note:rec.note}]})})}
  if(act==='sale-load')openForm('load',null,{title:`Add load · ${s.crop} to ${s.buyer||'buyer'}`,vals:{date:TODAY},back,
    onSave:live((s,rec)=>{s.loads=[...(s.loads||[]),rec];s.status=remaining(s)<=0?'Delivered':'Open'})});
  if(act==='load-del'){const id=a.dataset.id;if(detail.confirmLoad!==id){detail.confirmLoad=id;drawSale();return}
    s.loads=s.loads.filter(l=>l.id!==id);s.status=remaining(s)<=0?'Delivered':'Open';detail.confirmLoad=null;persist(S.current);drawSale()}
  if(act==='roll-add')openForm('roll',null,{title:`Record a roll · ${s.crop} ${typeName(s)}`,vals:{date:TODAY,from:s.futuresMonth||''},back,
    onSave:live((s,rec)=>{s.rolls=[...(s.rolls||[]),rec];if(rec.to)s.futuresMonth=rec.to})});
  if(act==='roll-del'){const id=a.dataset.id;if(detail.confirmRoll!==id){detail.confirmRoll=id;drawSale();return}
    const r=(s.rolls||[]).find(x=>x.id===id);s.rolls=(s.rolls||[]).filter(x=>x.id!==id);
    if(r&&r.from&&r.to&&s.futuresMonth===r.to)s.futuresMonth=r.from;detail.confirmRoll=null;persist(S.current);drawSale()}
  if(act==='acc-update')openForm('accupd',null,{title:`Update accumulated · ${s.crop} accumulator`,vals:{date:TODAY,accBu:s.accBu??'',sched:accScheduled(s)},back,
    onSave:live((s,rec)=>{s.accBu=rec.accBu;s.accLog=[...(s.accLog||[]),{id:rec.id,date:rec.date,accBu:rec.accBu,note:rec.note}];if(s.trackLoads)s.status=remaining(s)<=0?'Delivered':'Open'})});
  if(act==='acc-knock')openForm('knock',null,{title:`Record knock-out · ${s.crop} accumulator`,vals:{date:TODAY,accBu:s.accBu??''},back,
    onSave:live((s,rec)=>{s.knockedOut=true;s.knockOutDate=rec.date;s.accBu=rec.accBu;s.accLog=[...(s.accLog||[]),{id:rec.id,date:rec.date,accBu:rec.accBu,note:'Knocked out'}]})});
  if(act==='pp-double'||act==='pp-none'){s.ppOutcome=act==='pp-double'?'Doubled up':'No double-up';if(s.trackLoads)s.status=remaining(s)<=0?'Delivered':'Open';persist(S.current);drawSale()}
  if(act==='pp-reset'){delete s.ppOutcome;persist(S.current);drawSale()}
  if(act==='acc-unknock'){s.knockedOut=false;delete s.knockOutDate;persist(S.current);drawSale()}
  if(act==='sale-toggle'){s.status=s.status==='Delivered'?'Open':'Delivered';persist(S.current);drawSale()}
  if(act==='sale-track'){s.trackLoads=true;s.loads=s.loads||[];s.status=remaining(s)<=0?'Delivered':'Open';persist(S.current);drawSale()}
});
$('#dlgform').addEventListener('submit',e=>{
  e.preventDefault();if(!dlgCtx)return;const{kind,vals}=dlgCtx;const spec=FORMS[kind];
  const rec=dlgCtx.base?clone(dlgCtx.base):{id:uid()};
  spec.fields.forEach(f=>{if(f.show&&!f.show(vals)){delete rec[f.k];return}
    let v=vals[f.k];if(f.type==='number')v=num(v);else if(f.type==='check')v=!!v;else v=(v??'').toString().trim();rec[f.k]=v});
  if(typeof rec.crop==='string'&&rec.crop)rec.crop=rec.crop.charAt(0).toUpperCase()+rec.crop.slice(1);
  const{onSave,back}=dlgCtx;dlgCtx=null;onSave(rec);back?back():$('#dlg').close()});

  ${leg?`<div class="callout"><span>${isMM(s)&&leg==='futures'?`Final futures isn't set yet. It will land between ${usd(num(s.minPrice))} and ${usd(num(s.maxPrice))}.`:leg==='basis'?'The futures price is locked; the basis is still open.':'The basis is locked; the futures price is still open.'}</span><button type="button" class="primary small" data-act="sale-price" data-leg="${leg}">Set ${leg}</button></div>`:''}
  <dl class="facts">
    ${fact(legLabel(s,'price'),usd(num(s.price)))}

    ${!isHedge?fact('Flat price',`<b>${usd(fp)}</b>`):''}

    :S.assets?`<div style="margin-top:12px"><button type="button" class="small" data-act="photo-add">Attach contract photo</button></div>`:''}

  let profit=null,pac=0;mk.forEach(({r,m})=>{if(m.full&&m.profit!=null){profit=(profit||0)+m.profit;pac+=n0(r.plan.acres)}});
  const insRows=rows.filter(r=>r.insured>0),insured=insRows.reduce((a,r)=>a+r.insured,0),insSold=insRows.reduce((a,r)=>a+r.sold,0);

function snowflakeSQL(){

  return`-- Grain Marketing Desk -> Snowflake
-- Generated by the app. Column order matches the CSV files in this export.
-- Every table has EXPORTED_AT, so each export is kept as a snapshot and you can

${t.map(x=>`CREATE TABLE IF NOT EXISTS ${x.name} (\n  EXPORTED_AT TIMESTAMP_TZ,\n${x.cols.map(c=>`  ${c[0]} ${c[1]}`).join(',\n')}\n);`).join('\n\n')}

${t.map(x=>x.cols.map(c=>`ALTER TABLE ${x.name} ADD COLUMN IF NOT EXISTS ${c[0]} ${c[1]};`).join('\n')).join('\n')}

${t.map(x=>`CREATE OR REPLACE VIEW ${x.name}_CURRENT AS\n  SELECT * FROM ${x.name} WHERE EXPORTED_AT = (SELECT MAX(EXPORTED_AT) FROM ${x.name});`).join('\n')}

-- 2) EACH EXPORT ------------------------------------------------------------
-- Option A: Snowflake CLI or SnowSQL. Unzip the export, then (fix the path):
--   PUT 'file://C:/path/to/export/*.csv' @GRAIN_DESK_STAGE AUTO_COMPRESS = TRUE OVERWRITE = TRUE;
${t.map(x=>`COPY INTO ${x.name} FROM @GRAIN_DESK_STAGE FILES = ('${x.file}.gz') FILE_FORMAT = (FORMAT_NAME = GRAIN_DESK_CSV) ON_ERROR = ABORT_STATEMENT FORCE = TRUE;`).join('\n')}

-- Option B: in Snowsight, open each table under GRAIN_MARKETING.MARKETING, choose
-- Load Data, pick the matching CSV and the GRAIN_DESK_CSV file format.

-- 3) EXAMPLE ANALYSIS: percent sold and price vs. break-even, every export --
SELECT p.EXPORTED_AT, f.FARM_NAME, p.CROP_YEAR, p.CROP, p.EXPECTED_BU, p.INSURED_BU, p.BREAKEVEN_PER_BU,
  SUM(IFF(c.IS_HEDGE, 0, c.BUSHELS)) AS CONTRACTED_BU,
  DIV0(SUM(IFF(c.IS_HEDGE, 0, c.BUSHELS)), p.EXPECTED_BU) AS PCT_CONTRACTED,
  DIV0(SUM(c.PRICED_VALUE), SUM(IFF(c.FLAT_PRICE IS NULL, 0, c.BUSHELS))) AS AVG_FLAT_PRICE
FROM CROP_PLANS p
JOIN FARMS f ON f.FARM_ID = p.FARM_ID AND f.EXPORTED_AT = p.EXPORTED_AT
LEFT JOIN CONTRACTS c ON c.FARM_ID = p.FARM_ID AND c.EXPORTED_AT = p.EXPORTED_AT
  AND c.CROP_YEAR = p.CROP_YEAR AND LOWER(c.CROP) = LOWER(p.CROP)
WHERE NOT f.IS_SAMPLE
GROUP BY p.EXPORTED_AT, f.FARM_NAME, p.CROP_YEAR, p.CROP, p.EXPECTED_BU, p.INSURED_BU, p.BREAKEVEN_PER_BU
ORDER BY p.EXPORTED_AT, f.FARM_NAME, p.CROP_YEAR, p.CROP;
`}

  call:{label:'Sell call',note:'Collects premium. Gives up gains above the strike.',fields:[['bu','Bushels'],['strike','Strike'],['premium','Premium received']]},
  pp:{label:'Premium Plus',note:'Contract + premium. Doubles at the strike if futures close at or above it.',fields:[['bu','Base bushels'],['price','Contract futures'],['premium','Premium'],['strike','Call strike']]},
  cash:{label:'Sell cash now',note:'Locks today’s cash price on these bushels.',fields:[['bu','Bushels'],['price','Cash price']]},
  hedge:{label:'Sell futures',note:'Locks the futures level. Basis stays open.',fields:[['bu','Bushels'],['price','Futures price']]},
  carry:{label:'Store for carry',note:'Hold grain to capture the futures carry and basis gain, less storage and interest.',fields:[['bu','Bushels'],['months','Months stored'],['carry','Futures carry $/bu'],['basisGain','Basis gain $/bu'],['storage','Storage $/bu/mo'],['rate','Interest %/yr']]},

function optChart(xs,series,F0){

const FSA_REF={corn:4.10,soybeans:10.00,wheat:6.35},FSA_LOAN={corn:2.42,soybeans:6.82,wheat:3.72}; // 2025 law: statutory reference prices, 2026+ loan rates

const INS_VIEWS=[['policy','Policy'],['levels','Coverage levels'],['pays','What it pays'],['addons','SCO / ECO'],['fsa','ARC / PLC']];

// o: {cov, harvest, yield (bu/ac), cntyPct (county revenue or yield as a share of expected)}
function insCalc(c,o={}){
  const t=c.insType,ac=n0(c.acres),aph=n0(c.aph),cov=num(o.cov)??n0(c.coverage),p=n0(projOf(c));
  if(!t||t==='None'||!ac||!aph||!p||!cov)return null;
  const h=num(o.harvest)??harvOf(c)??p,y=num(o.yield)??aph,cp=num(o.cntyPct)??y/aph;

  const band=(top,bot)=>{const w=(top-bot)/100;if(w<=0)return{liab:0,pay:0};return{liab:value*w,pay:value*w*Math.min(1,Math.max(0,(top/100-ratio)/w))}};

// phone photos are large; shrink to ~2000px JPEG before sending or storing (also fixes rotation)
async function shrinkImage(file,max=2000){
  try{const bmp=await createImageBitmap(file,{imageOrientation:'from-image'}),k=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*k);cv.height=Math.round(bmp.height*k);
    cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);return await new Promise(r=>cv.toBlob(b=>r(b||file),'image/jpeg',0.85))}
  catch(_){return file}}

function scanPrompt(){return`You are reading a photo of a US grain marketing contract (an elevator or processor purchase contract, or a broker confirmation). Extract its details for a farm record-keeping app.
Reply with ONLY one JSON object with exactly these keys (use null for anything not shown on the document; never guess):
{"isContract": true or false,
 "summary": "one short sentence describing the contract",
 "type": "forward" | "spot" | "hta" | "basis" | "accumulator" | "premium_plus" | "min_max" | "futures_hedge" | "other",
 "specialtyName": string or null (contract program name, only when type is "other"),
 "crop": "Corn" | "Soybeans" | "Wheat" | null,
 "cropYear": number or null,
 "date": "YYYY-MM-DD" or null (date the contract was made),
 "bushels": number or null,
 "flatPrice": number or null (fixed cash price, $/bu),
 "futuresPrice": number or null (futures level, $/bu),
 "basis": number or null ($/bu, negative when under futures),
 "futuresMonth": string or null (like "Dec 26"),
 "buyer": string or null, "contractNo": string or null, "location": string or null,
 "deliveryStart": "YYYY-MM-DD" or null, "deliveryEnd": "YYYY-MM-DD" or null,
 "premium": number or null, "strike": number or null, "expiration": "YYYY-MM-DD" or null,
 "minPrice": number or null, "maxPrice": number or null, "fee": number or null,
 "knockOut": number or null, "accumulationRate": number or null, "ratePeriod": "Daily" | "Weekly" | null,
 "uncertain": [names of keys above whose values you could not read clearly or are unsure of]}
Type guide: forward = fixed flat price for later delivery; spot = cash sale priced and delivered now; hta = hedge-to-arrive, futures fixed and basis open; basis = basis fixed and futures open; accumulator = bushels accumulate daily/weekly at a level with a knock-out; premium_plus = contract with a premium and a sold call that can double the bushels; min_max = floor and ceiling futures prices; futures_hedge = a broker futures position, not a cash contract; other = any other program.
All prices in dollars per bushel: convert cents (452 or 452'4 cents means 4.52 or 4.525). Bushels as a plain number. Today is ${TODAY}; use it only to complete two-digit years.
If the image is not a grain contract, set "isContract" to false and the rest to null.`}
// turn Claude's reading into contract form values, plus which fields to flag for review
function scanToVals(d){
  const type=SCAN_TYPES[d.type]||'Forward contract',n=v=>num(v),v={type,crop:SALE_CROPS.find(c=>key(c)===key(d.crop))||d.crop||'Corn',
    year:n(d.cropYear)??S.year,date:/^\d{4}-\d\d-\d\d$/.test(d.date||'')?d.date:TODAY,bu:n(d.bushels),basis:n(d.basis),futuresMonth:d.futuresMonth||'',
    buyer:d.buyer||'',contractNo:d.contractNo||'',location:d.location||'',deliveryStart:d.deliveryStart||'',deliveryEnd:d.deliveryEnd||'',status:'Open',trackLoads:false,source:'Bin',ratePeriod:'Daily',accStart:TODAY};
  const flat=['Forward contract','Cash sale'].includes(type);v.price=flat?n(d.flatPrice)??n(d.futuresPrice):n(d.futuresPrice);
  if(type==='Accumulator')Object.assign(v,{knockOut:n(d.knockOut),rate:n(d.accumulationRate),ratePeriod:d.ratePeriod==='Weekly'?'Weekly':'Daily',expiration:d.expiration||''});
  if(type==='Put option')Object.assign(v,{premium:n(d.premium),strike:n(d.strike),ppExpiration:d.expiration||''});
  if(type==='Min/Max')Object.assign(v,{minPrice:n(d.minPrice),maxPrice:n(d.maxPrice),mmFee:n(d.fee),mmExpiration:d.expiration||'',price:null});
  if(type==='Other')Object.assign(v,{specialtyName:d.specialtyName||'',otherFlat:n(d.flatPrice),otherDate:d.expiration||''});
  const k2={bushels:'bu',flatPrice:'price',futuresPrice:'price',cropYear:'year',accumulationRate:'rate',fee:'mmFee',
    expiration:type==='Accumulator'?'expiration':type==='Put option'?'ppExpiration':type==='Min/Max'?'mmExpiration':'otherDate'};
  const flags=[...new Set([...(Array.isArray(d.uncertain)?d.uncertain:[]).map(x=>k2[x]||x),'source',...(v.bu==null?['bu']:[])])];
  return{v,flags}}

function preview(msg){
  S.mode='preview';S.owner=true;S.admin=true;S.note=msg;S.farms={'sample':normalize(PREVIEW)};S.current='sample';
  $('#who').textContent='Preview';render()}
async function boot(){
  const c=window.claude;
  if(!c||!c.use)return preview('Preview mode: showing sample data. Changes are not saved here.');
  const [db,user]=await Promise.all([c.use('db'),c.use('user')]);
  c.use('downloads').then(d=>{S.downloads=d;if(d&&!$('#dlg').open)render()});
  // contract scanning: Claude reads a photo (only where this view can send images); photos are kept as assets for writers
  c.use('sample').then(async sm=>{if(!sm)return;const lim=await sm.limits().catch(()=>null);S.sample=sm;S.sampleImg=lim&&lim.images?lim.images:null;if(S.sampleImg&&!$('#dlg').open)render()});
  c.use('assets').then(a=>{S.assets=a});
  if(!db||!user)return preview('Saving is not available in this view, so this shows sample data. Open the shared link while signed in to claude.ai to keep records.');
  S.db=db;S.user=user;S.uid=await user.id();S.owner=await user.isOwner();
  // owner = works with many client farms (consultant, or a broker on the hosted version);
  // admin = also manages what every client sees (Intel, program deadlines, broker assignments, Snowflake export)
  // in the Claude app, someone the consultant shares with as an Editor is a broker with their own customers
  S.hosted=!!c.hosted;
  S.role=user.role?await user.role():S.owner?'admin':(await user.canEdit().catch(()=>false))?'broker':'farmer';
  S.admin=S.role==='admin';if(S.role==='broker')S.owner=true;
  if(!S.uid&&!S.owner){S.mode='noid';render();return}
  S.mode='live';
  const me=await user.me();S.myName=(me&&me.name)||'';
  $('#who').textContent=S.admin?'Consultant · '+(S.myName||'you'):S.role==='broker'?'Broker · '+S.myName:S.myName;
  const onErr=e=>{if(e&&e.code==='revoked'){S.note='Access to saved records has ended for this page.';render()}};
  // shared futures prices written by the evening sync; everyone reads, only the owner writes
  db.doc('market/futures').onSnapshot(d=>{S.market=d.exists?clone(d.data()):null;if(!$('#dlg').open)render()},onErr);
  db.doc('market/bids').onSnapshot(d=>{S.bids=d.exists?clone(d.data()):null;if(!$('#dlg').open&&S.section==='quotes')render()},onErr);
  db.doc('market/intel').onSnapshot(d=>{S.intel=d.exists?clone(d.data()):null;if(!$('#dlg').open)render()},onErr);
  db.doc('market/deadlines').onSnapshot(d=>{S.deadlines=d.exists?clone(d.data()):null;if(!$('#dlg').open)render()},onErr);
  // farms arrive from several places (the consultant's own list, each broker's section); merge them into one view
  const sources={};
  const setSource=(k,prefix)=>snap=>{sources[k]=snap.docs.filter(d=>d.exists).map(d=>({id:d.id,data:normalize(d.data()),path:prefix+d.id}));
    const next={},paths={};Object.values(sources).flat().forEach(x=>{next[x.id]=x.data;paths[x.id]=x.path});
    S.farms=next;S.farmPaths=paths;if(S.current&&!next[S.current])S.current=null;if(!$('#dlg').open)render()};
  if(S.role==='broker'&&!S.hosted){
    // the broker's own section: a profile (so the consultant can find it) and their customers' farms
    const prof=db.doc('brokers/'+S.uid);
    prof.get().then(d=>{const p=d.exists?d.data():null;if(!p||p.name!==S.myName)return prof.set({name:S.myName,since:p&&p.since||TODAY})}).catch(()=>{});
    db.collection('brokers/'+S.uid+'/farms').onSnapshot(setSource('mine',`brokers/${S.uid}/farms/`),onErr);
  }else if(S.owner){
    db.collection('farms').onSnapshot(setSource('main','farms/'),onErr);
    // the consultant also sees every broker's customers (the Claude app keeps them in each broker's section)
    if(!S.hosted){const seen=new Set();
      db.collection('brokers').onSnapshot(snap=>snap.docs.forEach(d=>{if(!d.exists||seen.has(d.id))return;seen.add(d.id);
        db.collection('brokers/'+d.id+'/farms').onSnapshot(setSource('b:'+d.id,`brokers/${d.id}/farms/`),onErr)}),onErr)}
  }else{
    S.current=S.uid;
    db.doc('farms/'+S.uid).onSnapshot(d=>{if(d.exists)S.farms[S.uid]=normalize(d.data());else delete S.farms[S.uid];if(!$('#dlg').open)render()},onErr);
  }
  render()}
boot();
</script>
