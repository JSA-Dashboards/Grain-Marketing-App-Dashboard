<title>Grain Marketing Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app bar + farm header + tabbed work area; summary strip first, detail tables below */
:root{
  --bg:#F1F4EE; --surface:#FFFFFF; --soft:#E4EAE0; --line:#D3DBCF;
  --ink:#17201A; --muted:#5A675E;
  --accent:#1D6A4D; --accent-ink:#FFFFFF; --grain:#B5862B;
  --good:#2C7A4C; --warn:#A86A12; --bad:#AE3D2B;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111612; --surface:#192019; --soft:#232C25; --line:#2E3830;
  --ink:#E4EBE5; --muted:#99A69C;
  --accent:#5FBC90; --accent-ink:#0C1810; --grain:#D9AF57;
  --good:#6BC38F; --warn:#E2A94B; --bad:#E57B66; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111612; --surface:#192019; --soft:#232C25; --line:#2E3830;
  --ink:#E4EBE5; --muted:#99A69C;
  --accent:#5FBC90; --accent-ink:#0C1810; --grain:#D9AF57;
  --good:#6BC38F; --warn:#E2A94B; --bad:#E57B66; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{font-family:var(--f-display);font-stretch:88%;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:780}
h2{font-size:1.15rem;font-weight:720}
h3{font-size:.95rem;font-weight:700}
.num,td.n,.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

.bar{display:flex;align-items:center;gap:12px;padding-block:14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-family:var(--f-display);font-stretch:112%;font-weight:800;font-size:.95rem;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.brand svg{color:var(--grain)}
.bar .sp{flex:1}
.who{font-size:.85rem;color:var(--muted)}

.banner{margin-top:14px;padding:10px 14px;border-radius:var(--r);background:var(--soft);font-size:.88rem}
.farmhead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-block:22px 6px}
.farmhead .sp{flex:1}
.crumb{font-size:.85rem;margin-bottom:4px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin-top:10px}
.tab{appearance:none;border:0;background:none;font:600 .92rem var(--f-body);color:var(--muted);padding:10px 14px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

button,.btn{font:600 .88rem var(--f-body);border-radius:var(--r);padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600}
button.danger{color:var(--bad)}
button.small{padding:4px 10px;font-size:.8rem}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;width:100%}

section{margin-top:26px}
.sechead{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.sechead .sp{flex:1}

.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:20px}
.stat{background:var(--surface);padding:14px 16px;min-width:0}
.stat .v{font-family:var(--f-data);font-size:1.45rem;font-weight:500;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .s{font-size:.8rem;color:var(--muted)}
@media (max-width:720px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th.n,td.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{color:var(--ink);display:block;font-family:var(--f-display);font-size:1.05rem;margin-bottom:4px}

.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;border:1px solid currentColor}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.neutral{color:var(--muted)}
.pill.solid{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* marketing position bars */
.pos{padding:6px 18px 14px}
.posrow{display:grid;grid-template-columns:140px minmax(0,1fr) 210px;gap:16px;align-items:center;padding-block:14px;border-bottom:1px solid var(--line)}
.posrow:last-child{border-bottom:0}
.posrow .crop{font-family:var(--f-display);font-weight:720;font-size:1.02rem}
.track{position:relative;height:22px;background:var(--soft);border-radius:3px;display:flex;overflow:visible}
.seg{height:100%}
.seg.sold{background:var(--accent);border-radius:3px 0 0 3px}
.seg.hedged{background:var(--grain)}
.ins{position:absolute;top:-5px;bottom:-5px;width:0;border-left:2px dashed var(--ink)}
.ins span{position:absolute;top:-18px;left:-1px;transform:translateX(-50%);font-size:.66rem;white-space:nowrap;color:var(--muted)}
.posfacts{font-size:.8rem;display:grid;grid-template-columns:auto auto;gap:2px 10px}
.posfacts dt{color:var(--muted)} .posfacts dd{margin:0;text-align:right;font-family:var(--f-data)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);padding:12px 18px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
@media (max-width:760px){.posrow{grid-template-columns:minmax(0,1fr)}.posrow .track{margin-top:14px}}

.alerts{list-style:none;margin:0;padding:0}
.alerts li{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.alerts li:last-child{border-bottom:0}
.alerts .dot{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px}
.dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)} .dot.neutral{background:var(--muted)}

.binbar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;min-width:90px}
.binbar div{height:100%;background:var(--accent)}
.binbar div.over{background:var(--bad)}

.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}

dialog{border:1px solid var(--line);border-radius:10px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,20,14,.45)}
dialog form{padding:20px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-top:14px}
.fgrid .full{grid-column:1/-1}
.fgrid label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted)}
.fgrid .hint{font-weight:400;font-size:.74rem}
@media (max-width:480px){.fgrid{grid-template-columns:1fr}}
.dlgfoot{display:flex;gap:10px;margin-top:18px;align-items:center}
.dlgfoot .sp{flex:1}

.explain{max-width:85ch;font-size:.82rem;color:var(--muted);margin-top:12px;display:grid;gap:6px}
.explain p{margin:0} .explain b{color:var(--ink)}
tfoot td{border-top:1px solid var(--line);border-bottom:0;background:var(--soft)}
/* sales & contracts */
.strip5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:900px){.strip5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.strip5{grid-template-columns:repeat(2,minmax(0,1fr))}}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px}
.filters input{flex:2 1 220px;width:auto}
.filters select{flex:1 1 140px;width:auto}
.sortbtn{border:0;background:none;padding:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer}
.sortbtn:hover{color:var(--ink)}
.seg-ctl{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg-ctl button{border:0;border-radius:0;padding:6px 12px;font-size:.82rem;background:var(--surface);color:var(--muted)}
.seg-ctl button+button{border-left:1px solid var(--line)}
.seg-ctl button[aria-pressed="true"]{background:var(--soft);color:var(--ink)}
.prog{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:6px}
.prog div{height:100%;background:var(--accent)}
.prog.sm{height:4px;width:70px;margin-left:auto}
.progtext{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-top:4px}
.cards{display:none;list-style:none;margin:0;padding:0}
.cards li{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;gap:4px;cursor:pointer}
.cards li:last-child{border-bottom:0}
.cl{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:.88rem}
@media (max-width:640px){.desk{display:none}.cards{display:block}}
li.click{cursor:pointer} li.click:hover{background:var(--soft)}
[data-sale]:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.callout{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:14px;padding:10px 12px;border-radius:var(--r);background:var(--soft);font-size:.86rem}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 16px;margin:14px 0 0}
.facts dt{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.facts dd{margin:2px 0 0;font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:.9rem}
.dsub{margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
table.mini{font-size:.82rem;margin-top:10px} table.mini td,table.mini th{padding:6px 8px}
.hist{list-style:none;margin:8px 0 0;padding:0;font-size:.85rem;display:grid;gap:4px}
.hist li{display:flex;gap:12px} .hist .mono{color:var(--muted);min-width:96px}
.fgrid label.check{flex-direction:column;color:var(--ink);font-weight:600;font-size:.86rem}
.fgrid label.check input{width:auto;margin-right:6px;vertical-align:-2px}
textarea{resize:vertical;font-family:var(--f-data);font-size:.82rem;margin-top:10px}
dialog{max-height:calc(100vh - 32px);overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:var(--r);font-size:.86rem;z-index:20;max-width:calc(100vw - 32px)}
.toast.err{background:var(--bad);color:#fff}
.onboard{max-width:460px;margin:48px auto 0}
.onboard p{color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.seg{transition:width .4s ease}}
</style>

<div class="wrap">
  <div class="bar">
    <div class="brand"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 22V8"/><path d="M12 8c0-3 2-5 4-6 0 3-1 5-4 6zM12 8C12 5 10 3 8 2c0 3 1 5 4 6zM12 13c0-3 2-5 4-6 0 3-1 5-4 6zM12 13c0-3-2-5-4-6 0 3 1 5 4 6zM12 18c0-3 2-5 4-6 0 3-1 5-4 6zM12 18c0-3-2-5-4-6 0 3 1 5 4 6z"/></svg>Grain Marketing Desk</div>
    <div class="sp"></div>
    <div class="who" id="who"></div>
  </div>
  <div id="app"><div class="empty" style="margin-top:40px"><b>Loading your farm records…</b>Connecting to saved data.</div></div>
</div>
<dialog id="dlg"><form id="dlgform" method="dialog"></form></dialog>
<div class="toast" id="toast" hidden></div>

<script>
const CONTRACT_TYPES=['Cash sale','Forward contract','HTA','Basis contract'];
const HEDGE_TYPES=['Futures hedge','Put option'];
const SALE_TYPES=[...CONTRACT_TYPES,...HEDGE_TYPES];
const DELIVERABLE=['Forward contract','HTA','Basis contract'];
const INS_TYPES=['RP','RP-HPE','YP','None'];
const CROPS=['Corn','Soybeans','Wheat','Sorghum','Barley','Oats','Canola','Sunflowers'];
const SALE_CROPS=['Corn','Soybeans','Wheat'];
const TODAY=new Date().toISOString().slice(0,10);
const THIS_YEAR=new Date().getFullYear();

const S={mode:'loading',db:null,user:null,uid:null,owner:false,farms:{},current:null,tab:'overview',year:THIS_YEAR,note:'',names:{},
  flt:{q:'',crop:'',type:'',buyer:'',status:''},sort:{k:'date',dir:-1},by:'crop',downloads:null};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>(v===''||v==null||isNaN(+v))?null:+v;
const n0=v=>num(v)??0;
const bu=v=>Math.round(v).toLocaleString('en-US');
const usd=(v,d=2)=>v==null?'—':(v<0?'−$':'$')+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=v=>v==null||!isFinite(v)?'—':Math.round(v*100)+'%';
const uid=()=>Math.random().toString(36).slice(2,10);
const key=s=>String(s||'').trim().toLowerCase();
const fmtDate=d=>{if(!d)return '—';const t=new Date(d+'T12:00:00');return isNaN(t)?d:t.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})};
const daysUntil=d=>Math.round((new Date(d+'T12:00:00')-new Date(TODAY+'T12:00:00'))/864e5);
const clone=o=>JSON.parse(JSON.stringify(o));
function normalize(d){d=clone(d||{});return{name:d.name||'Unnamed farm',sample:!!d.sample,crops:d.crops||[],sales:d.sales||[],bins:d.bins||[],updatedAt:d.updatedAt||null}}
function toast(msg,err){const t=$('#toast');t.textContent=msg;t.className='toast'+(err?' err':'');t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,err?6000:1800)}

/* ---------- calculations ---------- */
function flatPrice(s){const p=num(s.price),b=num(s.basis);
  if(s.type==='Cash sale'||s.type==='Forward contract')return p;
  if(s.type==='HTA'||s.type==='Basis contract')return(p!=null&&b!=null)?p+b:null;
  return null}
const yieldOf=p=>num(p.expectedYield)??n0(p.aph);
const loadsBu=s=>(s.loads||[]).reduce((a,l)=>a+n0(l.netBu),0);
function delivered(s){
  if(s.type==='Cash sale')return n0(s.bu);
  if(!DELIVERABLE.includes(s.type))return 0;
  return s.trackLoads?loadsBu(s):(s.status==='Delivered'?n0(s.bu):0)}
const remaining=s=>DELIVERABLE.includes(s.type)?Math.max(0,n0(s.bu)-delivered(s)):0;
function openLeg(s){
  if(s.type==='HTA'&&num(s.basis)==null)return'basis';
  if(s.type==='Basis contract'&&num(s.price)==null)return'futures';
  return null}
const legLabel=(s,leg)=>leg==='basis'?'Basis':s.type==='Put option'?'Strike':(s.type==='Cash sale'||s.type==='Forward contract')?'Flat price':'Futures';
const fmtBasis=v=>num(v)==null?'—':(num(v)<0?'−':'+')+Math.abs(num(v)).toFixed(2);
function position(f,year){
  const rows={};
  f.crops.filter(c=>+c.year===+year).forEach(c=>{rows[key(c.crop)]={plan:c,crop:c.crop,sales:[]}});
  f.sales.filter(s=>+s.year===+year).forEach(s=>{const k=key(s.crop);(rows[k]||(rows[k]={plan:null,crop:s.crop,sales:[]})).sales.push(s)});
  return Object.values(rows).map(r=>{
    const p=r.plan;
    const yld=p?yieldOf(p):0,expected=p?n0(p.acres)*yld:0;
    const sold=r.sales.filter(s=>CONTRACT_TYPES.includes(s.type)).reduce((a,s)=>a+n0(s.bu),0);
    const hedged=r.sales.filter(s=>HEDGE_TYPES.includes(s.type)).reduce((a,s)=>a+n0(s.bu),0);
    const priced=r.sales.filter(s=>flatPrice(s)!=null);
    const pricedBu=priced.reduce((a,s)=>a+n0(s.bu),0);
    const avg=pricedBu?priced.reduce((a,s)=>a+n0(s.bu)*flatPrice(s),0)/pricedBu:null;
    const be=p&&yld?n0(p.costPerAcre)/yld:null;
    const insured=p&&p.insType&&p.insType!=='None'?n0(p.acres)*n0(p.aph)*n0(p.coverage)/100:0;
    const insPrice=p?(p.insType==='RP'?Math.max(n0(p.projPrice),n0(p.harvestPrice)):n0(p.projPrice)):0;
    const revGuar=insured*insPrice;
    // break-even on the bushels not yet priced, after counting revenue already locked in
    const premiums=r.sales.filter(s=>s.type==='Put option').reduce((a,s)=>a+n0(s.bu)*n0(s.premium),0);
    const totalCost=p?n0(p.acres)*n0(p.costPerAcre)+premiums:0;
    const pricedRev=priced.reduce((a,s)=>a+n0(s.bu)*flatPrice(s),0);
    const restBu=expected-pricedBu;
    const dynBe=p&&n0(p.costPerAcre)&&restBu>0?(totalCost-pricedRev)/restBu:null;
    return{crop:r.crop,plan:p,yld,expected,sold,hedged,pricedBu,avg,be,insured,insPrice,revGuar,premiums,totalCost,pricedRev,restBu,dynBe,
      unpriced:Math.max(0,expected-sold-hedged)}
  }).sort((a,b)=>b.expected-a.expected)}
function deliveries(f){
  return f.sales.filter(s=>DELIVERABLE.includes(s.type)&&s.deliveryEnd).map(s=>{
    let st;if(remaining(s)<=0)st={t:'Delivered',c:'neutral'};
    else{const d=daysUntil(s.deliveryEnd);st=d<0?{t:'Overdue',c:'bad'}:d<=14?{t:'Due in '+d+'d',c:'warn'}:{t:'Open',c:'good'}}
    return{...s,st}}).sort((a,b)=>(a.deliveryEnd||'').localeCompare(b.deliveryEnd||''))}
function storage(f){
  const by={};
  f.bins.forEach(b=>{if(!b.crop)return;const k=key(b.crop);(by[k]||(by[k]={crop:b.crop,stored:0,open:0})).stored+=n0(b.bu)});
  f.sales.filter(s=>remaining(s)>0).forEach(s=>{const k=key(s.crop);(by[k]||(by[k]={crop:s.crop,stored:0,open:0})).open+=remaining(s)});
  const cap=f.bins.reduce((a,b)=>a+n0(b.capacity),0),used=f.bins.reduce((a,b)=>a+n0(b.bu),0);
  return{rows:Object.values(by).map(r=>({...r,free:Math.max(0,r.stored-r.open),short:Math.max(0,r.open-r.stored)})),cap,used}}
function alerts(f,year){
  const out=[];
  position(f,year).forEach(r=>{
    if(!r.plan)out.push({c:'neutral',t:`${r.crop}: no ${year} crop plan yet. Add acres and APH yield to see percent sold and break-even.`});
    if(r.insured>0&&r.sold>r.insured)out.push({c:'bad',t:`${r.crop}: ${bu(r.sold)} bu contracted is above the ${bu(r.insured)} bu insured guarantee. A short crop could leave contracts unfilled.`});
    if(r.plan&&(!r.plan.insType||r.plan.insType==='None')&&r.sold>0)out.push({c:'warn',t:`${r.crop}: bushels are contracted but no crop insurance is recorded.`});
    if(r.avg!=null&&r.be!=null&&r.avg<r.be)out.push({c:'warn',t:`${r.crop}: average priced sale ${usd(r.avg)} is ${usd(r.be-r.avg)}/bu below break-even (${usd(r.be)}).`});
  });
  deliveries(f).forEach(d=>{if(d.st.c==='bad')out.push({c:'bad',t:`${d.crop} ${d.type.toLowerCase()} to ${d.buyer||'buyer'}: ${bu(remaining(d))} bu still undelivered; window closed ${fmtDate(d.deliveryEnd)}.`});
    else if(d.st.c==='warn')out.push({c:'warn',t:`${d.crop} delivery to ${d.buyer||'buyer'} (${bu(remaining(d))} bu left) closes ${fmtDate(d.deliveryEnd)}.`})});
  f.sales.filter(s=>+s.year===+year&&openLeg(s)).forEach(s=>out.push({c:'neutral',t:`${s.crop} ${s.type.toLowerCase()} with ${s.buyer||'buyer'} (${bu(n0(s.bu))} bu): ${openLeg(s)} not set yet.`}));
  f.bins.forEach(b=>{if(n0(b.bu)>n0(b.capacity)&&n0(b.capacity)>0)out.push({c:'warn',t:`${b.name}: ${bu(n0(b.bu))} bu recorded is over its ${bu(n0(b.capacity))} bu capacity.`})});
  storage(f).rows.forEach(r=>{if(r.short>0&&r.stored>0)out.push({c:'warn',t:`${r.crop}: open contracts need ${bu(r.short)} bu more than is in storage.`})});
  const rank={bad:0,warn:1,neutral:2};return out.sort((a,b)=>rank[a.c]-rank[b.c])}
function years(f){const s=new Set([THIS_YEAR]);f.crops.forEach(c=>s.add(+c.year));f.sales.forEach(x=>s.add(+x.year));return[...s].filter(Boolean).sort((a,b)=>b-a)}

/* ---------- saving ---------- */
let queue=Promise.resolve();
function persist(id){
  const f=S.farms[id];f.updatedAt=new Date().toISOString();render();
  if(S.mode!=='live'){toast('Preview only — not saved');return}
  const data=clone(f);
  queue=queue.then(()=>S.db.doc('farms/'+id).set(data)).then(()=>toast('Saved')).catch(e=>{
    toast(e&&e.code==='invalid_argument'?"You don't have permission to save. Ask your consultant to share this app with you as an Editor.":e&&e.code==='quota_exceeded'?'Storage is full. Remove old records and try again.':"Couldn't save. Check your connection and try again.",true)})}

const LISTS={sale:'sales',crop:'crops',ins:'crops',bin:'bins'};
let dlgCtx=null,detail=null;
function listSave(kind,id){return rec=>{const f=S.farms[S.current],list=LISTS[kind];
  f[list]=id?f[list].map(r=>r.id===id?rec:r):[...f[list],rec];if(rec.year)S.year=+rec.year;persist(S.current)}}
function saleSave(id){return rec=>{
  rec.loads=rec.loads||[];rec.pricing=rec.pricing||[];
  if(!id){if(num(rec.price)!=null)rec.pricing.push({id:uid(),date:rec.date,leg:legLabel(rec,'price'),value:rec.price,month:rec.futuresMonth||''});
    if(num(rec.basis)!=null)rec.pricing.push({id:uid(),date:rec.date,leg:'Basis',value:rec.basis})}

function openForm(kind,id,opts={}){

    :`<input id="f_${f.k}" name="${f.k}" type="${f.type}" ${f.step?`step="${f.step}"`:''} ${f.list?`list="${f.list}"`:''} ${f.req?'required':''} value="${esc(vals[f.k]??'')}">`}
    ${val(f.hint)?`<span class="hint">${esc(val(f.hint))}</span>`:''}</label>`).join('')}</div>

$('#dlgform').addEventListener('input',e=>{
  const t=e.target;if(!t.name||!dlgCtx)return;dlgCtx.vals[t.name]=t.type==='checkbox'?t.checked:t.value;
  if(t.tagName==='SELECT'||t.type==='checkbox'){drawForm();const el=$('#f_'+t.name);el&&el.focus()}});
$('#dlgform').addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
  if(dlgCtx){
    if(act==='cancel'){dlgCtx.back?dlgCtx.back():$('#dlg').close()}
    if(act==='del'){if(!dlgCtx.confirmDel){dlgCtx.confirmDel=true;drawForm();return}
      const del=dlgCtx.onDelete;$('#dlg').close();del()}
    return}
  if(!detail)return;
  const f=S.farms[S.current],s=f.sales.find(x=>x.id===detail.sid);if(!s)return;
  const back=()=>showSale(s.id),sid=s.id;
  const live=fn=>rec=>{const cur=S.farms[S.current]&&S.farms[S.current].sales.find(x=>x.id===sid);if(!cur){toast('That contract was removed.',true);return}fn(cur,rec);persist(S.current)};
  if(act==='close')$('#dlg').close();
  if(act==='sale-edit')openForm('sale',s.id,{back});
  if(act==='sale-del'){if(!detail.confirmDel){detail.confirmDel=true;drawSale();return}
    f.sales=f.sales.filter(x=>x.id!==s.id);$('#dlg').close();persist(S.current)}
  if(act==='sale-price'){const leg=a.dataset.leg;
    openForm('price',null,{title:`Set ${leg} · ${s.crop} ${s.type.toLowerCase()}`,vals:{leg,date:TODAY,month:s.futuresMonth||''},back,
      onSave:live((s,rec)=>{if(leg==='basis')s.basis=rec.value;else s.price=rec.value;if(rec.month)s.futuresMonth=rec.month;
        s.pricing=[...(s.pricing||[]),{id:rec.id,date:rec.date,leg:leg==='basis'?'Basis':'Futures',value:rec.value,month:rec.month,note:rec.note}]})})}
  if(act==='sale-load')openForm('load',null,{title:`Add load · ${s.crop} to ${s.buyer||'buyer'}`,vals:{date:TODAY},back,
    onSave:live((s,rec)=>{s.loads=[...(s.loads||[]),rec];s.status=remaining(s)<=0?'Delivered':'Open'})});
  if(act==='load-del'){const id=a.dataset.id;if(detail.confirmLoad!==id){detail.confirmLoad=id;drawSale();return}
    s.loads=s.loads.filter(l=>l.id!==id);s.status=remaining(s)<=0?'Delivered':'Open';detail.confirmLoad=null;persist(S.current);drawSale()}
  if(act==='sale-toggle'){s.status=s.status==='Delivered'?'Open':'Delivered';persist(S.current);drawSale()}
  if(act==='sale-track'){s.trackLoads=true;s.loads=s.loads||[];s.status=remaining(s)<=0?'Delivered':'Open';persist(S.current);drawSale()}
});
$('#dlgform').addEventListener('submit',e=>{
  e.preventDefault();if(!dlgCtx)return;const{kind,vals}=dlgCtx;const spec=FORMS[kind];
  const rec=dlgCtx.base?clone(dlgCtx.base):{id:uid()};
  spec.fields.forEach(f=>{if(f.show&&!f.show(vals)){delete rec[f.k];return}
    let v=vals[f.k];if(f.type==='number')v=num(v);else if(f.type==='check')v=!!v;else v=(v??'').toString().trim();rec[f.k]=v});
  if(typeof rec.crop==='string'&&rec.crop)rec.crop=rec.crop.charAt(0).toUpperCase()+rec.crop.slice(1);

/* ---------- contract detail ---------- */
function showSale(sid){dlgCtx=null;detail={sid,confirmLoad:null,confirmDel:false};drawSale();if(!$('#dlg').open)$('#dlg').showModal()}
function drawSale(){
  const f=S.farms[S.current],s=f&&f.sales.find(x=>x.id===detail.sid);if(!s){$('#dlg').close();return}
  const fp=flatPrice(s),leg=openLeg(s),isDel=DELIVERABLE.includes(s.type),isHedge=HEDGE_TYPES.includes(s.type);
  const dv=delivered(s),rem=remaining(s),st=isDel&&s.deliveryEnd?deliveries({sales:[s]})[0].st:null;
  const loads=(s.loads||[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const disc=loads.reduce((a,l)=>a+n0(l.discount),0),gross=fp!=null?loadsBu(s)*fp:null;
  const fact=(k,v)=>`<div><dt>${k}</dt><dd>${v}</dd></div>`;
  $('#dlgform').innerHTML=`<div class="label">${esc(s.year)} crop · ${esc(s.type)}${s.contractNo?' · #'+esc(s.contractNo):''}</div>
  <h2 style="margin-top:2px">${bu(n0(s.bu))} bu ${esc(s.crop)} ${isHedge?'via':'to'} ${esc(s.buyer||'—')}</h2>
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${st?`<span class="pill ${st.c}">${st.t}</span>`:''}${leg?`<span class="pill warn">${leg==='basis'?'Basis':'Futures'} not set</span>`:''}${isHedge?'<span class="pill warn">Hedge, not a sale</span>':''}${fp!=null?'<span class="pill good">Fully priced</span>':''}</div>
  ${leg?`<div class="callout"><span>${leg==='basis'?'The futures price is locked; the basis is still open.':'The basis is locked; the futures price is still open.'}</span><button type="button" class="primary small" data-act="sale-price" data-leg="${leg}">Set ${leg}</button></div>`:''}
  <dl class="facts">
    ${fact(legLabel(s,'price'),usd(num(s.price)))}
    ${s.type==='HTA'||s.type==='Basis contract'?fact('Basis',fmtBasis(s.basis)):''}
    ${!isHedge?fact('Flat price',`<b>${usd(fp)}</b>`):''}
    ${!isHedge?fact('Contract value',fp!=null?usd(fp*n0(s.bu),0):'—'):''}
    ${s.type==='Put option'?fact('Premium',usd(num(s.premium))):''}
    ${s.futuresMonth?fact('Futures month',esc(s.futuresMonth)):''}
    ${fact('Date made',fmtDate(s.date))}
    ${isDel?fact('Delivery window',`${fmtDate(s.deliveryStart)} – ${fmtDate(s.deliveryEnd)}`):''}
    ${s.location?fact('Location',esc(s.location)):''}
  </dl>
  ${s.notes?`<p class="muted" style="font-size:.85rem;margin:10px 0 0">${esc(s.notes)}</p>`:''}
  ${isDel?`<h3 class="dsub">Delivery</h3>
    <div class="prog"><div style="width:${n0(s.bu)?Math.min(100,dv/n0(s.bu)*100):0}%"></div></div>
    <div class="progtext mono"><span>${bu(dv)} delivered</span><span>${bu(rem)} left of ${bu(n0(s.bu))}</span></div>
    ${s.trackLoads?(loads.length?`<div class="tablewrap"><table class="mini"><thead><tr><th>Date</th><th>Ticket</th><th class="n">Net bu</th><th class="n">Moist.</th><th class="n">Discounts</th><th></th></tr></thead><tbody>
      ${loads.map(l=>`<tr><td>${fmtDate(l.date)}</td><td>${esc(l.ticket||'—')}</td><td class="n">${bu(n0(l.netBu))}</td><td class="n">${num(l.moisture)==null?'—':n0(l.moisture).toFixed(1)+'%'}</td><td class="n">${num(l.discount)?usd(n0(l.discount)):'—'}</td>
        <td class="n"><button type="button" class="small danger" data-act="load-del" data-id="${l.id}">${detail.confirmLoad===l.id?'Confirm':'Remove'}</button></td></tr>`).join('')}</tbody></table></div>
      <dl class="facts" style="margin-top:10px">${fact('Gross for delivered',gross!=null?usd(gross):'Set price first')}${fact('Discounts & fees',disc?'−'+usd(disc):'—')}${fact('Est. settlement',gross!=null?`<b>${usd(gross-disc)}</b>`:'—')}</dl>`
      :`<p class="muted" style="font-size:.85rem">No loads logged yet.</p>`)+`<div style="margin-top:10px"><button type="button" class="small" data-act="sale-load">Add load</button></div>`
    :`<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px"><button type="button" class="small" data-act="sale-toggle">${s.status==='Delivered'?'Reopen contract':'Mark delivered'}</button>
      <button type="button" class="link" data-act="sale-track" style="font-size:.85rem">Track loads instead</button></div>`}`:''}
  ${(s.pricing||[]).length?`<h3 class="dsub">Pricing history</h3><ul class="hist">${s.pricing.map(p=>`<li><span class="mono">${fmtDate(p.date)}</span><span>${esc(p.leg)} ${p.leg==='Basis'?fmtBasis(p.value):usd(num(p.value))}${p.month?' · '+esc(p.month):''}${p.note?` <span class="muted">· ${esc(p.note)}</span>`:''}</span></li>`).join('')}</ul>`:''}
  <div class="dlgfoot"><button type="button" class="danger" data-act="sale-del">${detail.confirmDel?'Confirm delete':'Delete'}</button><div class="sp"></div>

/* ---------- rendering ---------- */
function render(){
  const app=$('#app');
  if(S.mode==='loading')return;
  if(S.mode==='noid'){app.innerHTML=`<div class="onboard"><h1>Sign in to keep your records</h1><p>Your farm records are saved to your claude.ai account. Sign in, then reopen this link.</p></div>`;return}
  const note=S.note?`<div class="banner">${esc(S.note)}</div>`:'';
  if(S.owner&&!S.current){app.innerHTML=note+renderClients();return}
  const f=S.farms[S.current];
  if(!f){app.innerHTML=note+renderOnboard();return}
  app.innerHTML=note+renderFarm(f)}

function renderOnboard(){return`<form class="onboard" id="onboard"><h1>Set up your farm</h1>
  <p>Track sales, contracts, storage, break-even and crop insurance in one place. Your consultant can see your records to help plan your marketing.</p>

  <div class="dlgfoot"><button class="primary" type="submit">Start tracking</button></div></form>`}

  const yrs=[...new Set([THIS_YEAR,THIS_YEAR+1,THIS_YEAR-1,...ids.flatMap(id=>years(S.farms[id]))])].sort((a,b)=>b-a);
  return`<div class="farmhead"><div><div class="label">Consultant view</div><h1>Client farms</h1></div><div class="sp"></div>

function tabOverview(f){
  const p=position(f,S.year);const st=storage(f);const al=alerts(f,S.year);
  const exp=p.reduce((a,r)=>a+r.expected,0),sold=p.reduce((a,r)=>a+r.sold,0),hed=p.reduce((a,r)=>a+r.hedged,0),rev=p.reduce((a,r)=>a+r.revGuar,0);

    return`<div class="posrow"><div><div class="crop">${esc(r.crop)}</div><div class="muted mono" style="font-size:.78rem">${r.expected?bu(r.expected)+' bu exp.':'No crop plan'}</div></div>
      <div class="track" role="img" aria-label="${esc(r.crop)}: ${bu(r.sold)} sold, ${bu(r.hedged)} hedged of ${bu(r.expected)} expected">

        <dt>Avg priced</dt><dd>${usd(r.avg)}</dd><dt>Break-even</dt><dd>${usd(r.be)}</dd><dt>BE on unpriced</dt><dd>${r.dynBe!=null?usd(r.dynBe):r.plan&&r.restBu<=0?'all priced':'—'}</dd>
        <dt>Margin/bu</dt><dd style="color:${r.avg!=null&&r.be!=null?(r.avg>=r.be?'var(--good)':'var(--bad)'):'inherit'}">${r.avg!=null&&r.be!=null?usd(r.avg-r.be):'—'}</dd></dl></div>`}).join('')
    :`<div class="empty"><b>No ${S.year} crops yet</b>Add a crop plan with acres and APH yield to see your marketing position.<div style="margin-top:12px"><button class="primary" data-add="crop">Add crop plan</button></div></div>`;
  const ups=deliveries(f).filter(d=>d.st.t!=='Delivered').slice(0,5);

    <div class="panel">${p.length?`<div class="legend"><span><i style="background:var(--accent)"></i>Sold / contracted</span><span><i style="background:var(--grain)"></i>Hedged (futures, puts)</span><span><i style="background:var(--soft);border:1px solid var(--line)"></i>Unpriced</span><span><i style="border-left:2px dashed var(--ink);border-radius:0;width:2px"></i>Insured bushels</span></div>`:''}<div class="pos">${bars}</div></div></section>

const STATUS_F={'':'All statuses',open:'Left to deliver',delivered:'Delivered',unpriced:'Needs pricing',hedges:'Hedges only'};
function filteredSales(f){
  const F=S.flt,q=key(F.q);
  const list=f.sales.filter(s=>+s.year===+S.year).filter(s=>(!F.crop||key(s.crop)===F.crop)&&(!F.type||s.type===F.type)&&(!F.buyer||key(s.buyer)===F.buyer)
    &&(!F.status||(F.status==='open'&&remaining(s)>0)||(F.status==='delivered'&&CONTRACT_TYPES.includes(s.type)&&remaining(s)<=0)
      ||(F.status==='unpriced'&&!!openLeg(s))||(F.status==='hedges'&&HEDGE_TYPES.includes(s.type)))
    &&(!q||[s.crop,s.type,s.buyer,s.contractNo,s.notes,s.location,s.futuresMonth].some(v=>key(v).includes(q))));
  const val={date:s=>s.date||'',crop:s=>key(s.crop),bu:s=>n0(s.bu),flat:s=>flatPrice(s),delivery:s=>s.deliveryEnd||null,left:s=>DELIVERABLE.includes(s.type)?remaining(s):null,buyer:s=>key(s.buyer)}[S.sort.k];
  return list.sort((a,b)=>{const x=val(a),y=val(b);if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return-1;return(x<y?-1:x>y?1:0)*S.sort.dir})}
function summarize(list,by){
  const g={};
  list.forEach(s=>{const k=by==='crop'?s.crop:by==='buyer'?(s.buyer||'—'):s.type;const r=g[key(k)]||(g[key(k)]={label:k,n:0,contracted:0,priced:0,value:0,hedged:0,left:0,crop:s.crop,crops:new Set()});
    r.n++;r.crops.add(key(s.crop));
    if(HEDGE_TYPES.includes(s.type)){r.hedged+=n0(s.bu);return}
    r.contracted+=n0(s.bu);r.left+=remaining(s);const fp=flatPrice(s);if(fp!=null){r.priced+=n0(s.bu);r.value+=n0(s.bu)*fp}});
  return Object.values(g).sort((a,b)=>b.contracted+b.hedged-a.contracted-a.hedged)}
function saleStatus(s){
  if(HEDGE_TYPES.includes(s.type))return`<span class="pill neutral">Hedge</span>`;
  const leg=openLeg(s);const d=DELIVERABLE.includes(s.type)&&s.deliveryEnd?deliveries({sales:[s]})[0].st:null;
  return(leg?`<span class="pill warn">Set ${leg}</span> `:'')+(d?`<span class="pill ${d.c}">${d.t}</span>`:s.type==='Cash sale'?'<span class="pill neutral">Delivered</span>':'')}

  return`<section><div class="sechead"><h2>${S.year} sales, contracts & hedges</h2><div class="sp"></div>
    <button class="small" data-act="copysum">Copy summary</button>${S.downloads?'<button class="small" data-act="export">Export CSV</button>':''}

  ${all.length?`<div class="filters">
    <input id="flt_q" type="search" placeholder="Search buyer, contract #, notes" value="${esc(F.q)}" aria-label="Search">
    <select id="flt_crop" aria-label="Crop">${opts(crops,F.crop,'All crops')}</select>
    <select id="flt_type" aria-label="Type">${opts(SALE_TYPES.map(t=>[t,t]),F.type,'All types')}</select>
    <select id="flt_buyer" aria-label="Buyer">${opts(buyers,F.buyer,'All buyers')}</select>
    <select id="flt_status" aria-label="Status">${Object.entries(STATUS_F).map(([v,l])=>`<option value="${v}" ${v===F.status?'selected':''}>${l}</option>`).join('')}</select>
    ${filtered?'<button class="link" data-act="clearflt">Clear filters</button>':''}</div>
  <div class="strip strip5">
    <div class="stat"><div class="label">Contracted</div><div class="v">${bu(tot.c)}</div><div class="s">bu${filtered?', filtered':''}</div></div>
    <div class="stat"><div class="label">Priced</div><div class="v">${tot.c?pct(tot.p/tot.c):'—'}</div><div class="s">${bu(tot.p)} bu with a flat price</div></div>
    <div class="stat"><div class="label">Priced value</div><div class="v">${usd(tot.v,0)}</div><div class="s">flat price × bushels</div></div>
    <div class="stat"><div class="label">Left to deliver</div><div class="v">${bu(tot.l)}</div><div class="s">bu on open contracts</div></div>
    <div class="stat"><div class="label">Needs pricing</div><div class="v" style="color:${needs?'var(--warn)':'inherit'}">${needs}</div><div class="s">${needs?'<button class="link" data-act="showunpriced">Show them</button>':'contracts with an open leg'}</div></div></div>`:''}
  <div class="panel" style="margin-top:16px">${list.length?`<div class="tablewrap desk"><table><thead><tr>${sh('date','Date')}${sh('crop','Crop')}<th>Type</th>${sh('buyer','Buyer')}${sh('bu','Bushels',1)}${sh('flat','Flat price',1)}${sh('delivery','Delivery')}${sh('left','Left',1)}<th>Status</th></tr></thead><tbody>
    ${list.map(s=>{const fp=flatPrice(s),isDel=DELIVERABLE.includes(s.type);
      return`<tr class="click" data-sale="${s.id}" tabindex="0"><td style="white-space:nowrap">${fmtDate(s.date)}</td><td>${esc(s.crop)}</td><td>${esc(s.type)}${s.contractNo?`<div class="muted mono" style="font-size:.74rem">#${esc(s.contractNo)}</div>`:''}</td><td>${esc(s.buyer||'—')}</td>
      <td class="n">${bu(n0(s.bu))}</td><td class="n"><b>${usd(fp)}</b><div class="muted" style="font-size:.74rem">${s.type==='HTA'||s.type==='Basis contract'?`fut ${usd(num(s.price))} · basis ${fmtBasis(s.basis)}`:HEDGE_TYPES.includes(s.type)?`${legLabel(s,'price').toLowerCase()} ${usd(num(s.price))}`:''}</div></td>

      <td>${saleStatus(s)}</td></tr>`}).join('')}</tbody></table></div>
    <ul class="cards">${list.map(s=>{const fp=flatPrice(s);return`<li data-sale="${s.id}" tabindex="0"><div class="cl"><b>${esc(s.crop)} · ${esc(s.type)}</b><span class="mono">${bu(n0(s.bu))} bu</span></div>

      <div class="cl"><span>${saleStatus(s)}</span>${DELIVERABLE.includes(s.type)&&remaining(s)>0?`<span class="muted mono" style="font-size:.8rem">${bu(remaining(s))} left</span>`:''}</div></li>`}).join('')}</ul>`
    :all.length?`<div class="empty"><b>No contracts match these filters</b><button class="link" data-act="clearflt">Clear filters</button></div>`
    :`<div class="empty"><b>No ${S.year} sales recorded</b>Add cash sales, forward contracts, HTAs, basis contracts, futures hedges and puts.</div>`}</div>

    <div class="panel tablewrap"><table><thead><tr><th>${S.by==='crop'?'Crop':S.by==='buyer'?'Buyer':'Type'}</th><th class="n">Contracts</th><th class="n">Contracted bu</th><th class="n">Priced bu</th><th class="n">Avg flat price</th><th class="n">Priced value</th><th class="n">Hedged bu</th><th class="n">Left to deliver</th></tr></thead><tbody>
    ${by.map(r=>`<tr><td><b>${esc(r.label)}</b></td><td class="n">${r.n}</td><td class="n">${bu(r.contracted)}</td><td class="n">${bu(r.priced)}</td><td class="n">${r.priced&&r.crops.size===1?usd(r.value/r.priced):r.priced?'<span class="muted" title="Mixed crops">mixed</span>':'—'}</td><td class="n">${r.value?usd(r.value,0):'—'}</td><td class="n">${r.hedged?bu(r.hedged):'—'}</td><td class="n">${r.left?bu(r.left):'—'}</td></tr>`).join('')}</tbody></table></div></section>`:''}
  <p class="muted" style="font-size:.8rem;margin-top:12px;max-width:85ch">Flat price = futures + basis. HTA and basis contracts count as contracted right away but get a flat price only once both parts are set. Hedges and puts protect price but aren't sales, so they're left out of contracted and priced totals. Averages are weighted by bushels.</p></section>`}

function csvSales(f){
  const cols=[['Date','date'],['Crop year','year'],['Crop','crop'],['Type','type'],['Contract #','contractNo'],['Buyer/broker','buyer'],['Location','location'],['Bushels',s=>n0(s.bu)],['Delivered bu',s=>delivered(s)],['Left to deliver',s=>remaining(s)],
    ['Futures month','futuresMonth'],['Futures/price','price'],['Basis','basis'],['Flat price',s=>flatPrice(s)??''],['Priced value',s=>{const fp=flatPrice(s);return fp==null?'':(fp*n0(s.bu)).toFixed(2)}],['Delivery opens','deliveryStart'],['Delivery closes','deliveryEnd'],['Status',s=>HEDGE_TYPES.includes(s.type)?'Hedge':remaining(s)>0?'Open':'Delivered'],['Notes','notes']];
  const cell=v=>{v=v==null?'':String(v);return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  return[cols.map(c=>c[0]).join(','),...filteredSales(f).map(s=>cols.map(([,k])=>cell(typeof k==='function'?k(s):s[k])).join(','))].join('\r\n')}
function textSummary(f){

  const un=f.sales.filter(s=>+s.year===+S.year&&openLeg(s));
  if(un.length){lines.push('','Still to price:');un.forEach(s=>lines.push(`- ${s.crop} ${s.type} with ${s.buyer||'buyer'}, ${bu(n0(s.bu))} bu: ${openLeg(s)} open`))}
  const up=deliveries(f).filter(d=>d.st.t!=='Delivered').slice(0,5);

  return lines.join('\n')}

    ['SCALE_TICKET','VARCHAR',r=>r.l.ticket||null],['NET_BU','NUMBER(14,2)',r=>nz(r.l.netBu)],['MOISTURE_PCT','NUMBER(5,2)',r=>nz(r.l.moisture)],
    ['DISCOUNTS_USD','NUMBER(12,2)',r=>nz(r.l.discount)],['NOTES','VARCHAR',r=>r.l.notes||null]]},
  {name:'PRICING_EVENTS',file:'pricing_events.csv',rows:(id,f)=>f.sales.flatMap(s=>(s.pricing||[]).map(p=>({id,s,p}))),cols:[
    ['FARM_ID','VARCHAR',r=>r.id],['CONTRACT_ID','VARCHAR',r=>r.s.id],['EVENT_ID','VARCHAR',r=>r.p.id],['PRICED_DATE','DATE',r=>r.p.date||null],

  {name:'BINS',file:'bins.csv',rows:(id,f)=>f.bins.map(b=>({id,b})),cols:[

    ['CAPACITY_BU','NUMBER(14,2)',r=>nz(r.b.capacity)],['CROP','VARCHAR',r=>r.b.crop||null],['BUSHELS','NUMBER(14,2)',r=>nz(r.b.bu)],
    ['MOISTURE_PCT','NUMBER(5,2)',r=>nz(r.b.moisture)],['LAST_CHECKED','DATE',r=>r.b.checked||null]]},

function snowflakeSQL(){
  const t=SF_TABLES;
  return`-- Grain Marketing Desk -> Snowflake
-- Generated by the app. Column order matches the CSV files in this export.
-- Every table has EXPORTED_AT, so each export is kept as a snapshot and you can
-- track marketing progress over time. The *_CURRENT views show the latest export.

-- 1) ONE-TIME SETUP ---------------------------------------------------------
CREATE DATABASE IF NOT EXISTS GRAIN_DESK;
CREATE SCHEMA IF NOT EXISTS GRAIN_DESK.MARKETING;
USE SCHEMA GRAIN_DESK.MARKETING;

CREATE FILE FORMAT IF NOT EXISTS GRAIN_DESK_CSV
  TYPE = CSV SKIP_HEADER = 1 FIELD_OPTIONALLY_ENCLOSED_BY = '"'
  EMPTY_FIELD_AS_NULL = TRUE NULL_IF = ('') ENCODING = 'UTF8';
CREATE STAGE IF NOT EXISTS GRAIN_DESK_STAGE FILE_FORMAT = GRAIN_DESK_CSV;

${t.map(x=>`CREATE TABLE IF NOT EXISTS ${x.name} (\n  EXPORTED_AT TIMESTAMP_TZ,\n${x.cols.map(c=>`  ${c[0]} ${c[1]}`).join(',\n')}\n);`).join('\n\n')}

${t.map(x=>`CREATE OR REPLACE VIEW ${x.name}_CURRENT AS\n  SELECT * FROM ${x.name} WHERE EXPORTED_AT = (SELECT MAX(EXPORTED_AT) FROM ${x.name});`).join('\n')}

-- 2) EACH EXPORT ------------------------------------------------------------
-- Option A: Snowflake CLI or SnowSQL. Unzip the export, then (fix the path):
--   PUT 'file://C:/path/to/export/*.csv' @GRAIN_DESK_STAGE AUTO_COMPRESS = TRUE OVERWRITE = TRUE;
${t.map(x=>`COPY INTO ${x.name} FROM @GRAIN_DESK_STAGE FILES = ('${x.file}.gz') FILE_FORMAT = (FORMAT_NAME = GRAIN_DESK_CSV) ON_ERROR = ABORT_STATEMENT FORCE = TRUE;`).join('\n')}
REMOVE @GRAIN_DESK_STAGE;
-- Option B: in Snowsight, open each table under GRAIN_DESK.MARKETING, choose
-- Load Data, pick the matching CSV and the GRAIN_DESK_CSV file format.

-- 3) EXAMPLE ANALYSIS: percent sold and price vs. break-even, every export --
SELECT p.EXPORTED_AT, f.FARM_NAME, p.CROP_YEAR, p.CROP, p.EXPECTED_BU, p.INSURED_BU, p.BREAKEVEN_PER_BU,
  SUM(IFF(c.IS_HEDGE, 0, c.BUSHELS)) AS CONTRACTED_BU,
  DIV0(SUM(IFF(c.IS_HEDGE, 0, c.BUSHELS)), p.EXPECTED_BU) AS PCT_CONTRACTED,
  DIV0(SUM(c.PRICED_VALUE), SUM(IFF(c.FLAT_PRICE IS NULL, 0, c.BUSHELS))) AS AVG_FLAT_PRICE
FROM CROP_PLANS p
JOIN FARMS f ON f.FARM_ID = p.FARM_ID AND f.EXPORTED_AT = p.EXPORTED_AT
LEFT JOIN CONTRACTS c ON c.FARM_ID = p.FARM_ID AND c.EXPORTED_AT = p.EXPORTED_AT
  AND c.CROP_YEAR = p.CROP_YEAR AND LOWER(c.CROP) = LOWER(p.CROP)
WHERE NOT f.IS_SAMPLE
GROUP BY p.EXPORTED_AT, f.FARM_NAME, p.CROP_YEAR, p.CROP, p.EXPECTED_BU, p.INSURED_BU, p.BREAKEVEN_PER_BU
ORDER BY p.EXPORTED_AT, f.FARM_NAME, p.CROP_YEAR, p.CROP;
`}
function snowflakeFiles(){
  const at=new Date().toISOString().replace('Z','+00:00'),ids=Object.keys(S.farms);
  const files=SF_TABLES.map(t=>{const rows=ids.flatMap(id=>t.rows(id,S.farms[id]));
    return{name:t.file,text:[['EXPORTED_AT',...t.cols.map(c=>c[0])].join(','),...rows.map(r=>[at,...t.cols.map(c=>c[2](r))].map(csvCell).join(','))].join('\r\n')+'\r\n',n:rows.length}});
  files.push({name:'snowflake_setup.sql',text:snowflakeSQL()});
  files.push({name:'README.txt',text:`Grain Marketing Desk export for Snowflake\nExported ${at}\n${ids.length} farms. ${files.filter(f=>f.n!=null).map(f=>`${f.name}: ${f.n} rows`).join(', ')}.\n\nFirst time: run section 1 of snowflake_setup.sql in a Snowflake worksheet.\nEvery export: load the CSV files with section 2 (Snowflake CLI) or Snowsight's Load Data.\nIS_SAMPLE marks example farms; filter them out in your analysis.\n`});
  return files}
function crc32(b){let c=~0;for(let i=0;i<b.length;i++){c^=b[i];for(let k=0;k<8;k++)c=c&1?(c>>>1)^0xEDB88320:c>>>1}return(~c)>>>0}
function makeZip(files){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;const d=new Date();
  const tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),dt=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  files.forEach(f=>{const nm=enc.encode(f.name),data=enc.encode(f.text),crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30));
    [[0,0x04034b50,4],[4,20,2],[6,0x0800,2],[8,0,2],[10,tm,2],[12,dt,2],[14,crc,4],[18,data.length,4],[22,data.length,4],[26,nm.length,2],[28,0,2]].forEach(([o,v,s])=>s===4?h.setUint32(o,v,true):h.setUint16(o,v,true));
    const c=new DataView(new ArrayBuffer(46));
    [[0,0x02014b50,4],[4,20,2],[6,20,2],[8,0x0800,2],[10,0,2],[12,tm,2],[14,dt,2],[16,crc,4],[20,data.length,4],[24,data.length,4],[28,nm.length,2],[30,0,2],[32,0,2],[34,0,2],[36,0,2],[38,0,4],[42,off,4]].forEach(([o,v,s])=>s===4?c.setUint32(o,v,true):c.setUint16(o,v,true));
    parts.push(h,nm,data);central.push(c,nm);off+=30+nm.length+data.length});
  const size=central.reduce((a,p)=>a+p.byteLength,0),e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,size,true);e.setUint32(16,off,true);
  return new Blob([...parts,...central,e],{type:'application/zip'})}

function tabStorage(f){

  <div class="panel tablewrap">${f.bins.length?`<table><thead><tr><th>Bin</th><th>Crop</th><th class="n">Bushels</th><th class="n">Capacity</th><th>Fill</th><th class="n">Moisture</th><th>Checked</th><th></th></tr></thead><tbody>
    ${f.bins.map(b=>{const fill=n0(b.capacity)?n0(b.bu)/n0(b.capacity):0;return`<tr class="click" data-edit="bin" data-id="${b.id}"><td><b>${esc(b.name)}</b><div class="muted" style="font-size:.78rem">${esc(b.location||'')}</div></td><td>${esc(b.crop||'Empty')}</td>

  <section><div class="sechead"><h2>Stored grain vs. open contracts</h2></div><div class="panel tablewrap">${st.rows.length?`<table><thead><tr><th>Crop</th><th class="n">In storage</th><th class="n">Committed to open contracts</th><th class="n">Uncommitted in storage</th><th class="n">Short to fill</th></tr></thead><tbody>
    ${st.rows.map(r=>`<tr><td><b>${esc(r.crop)}</b></td><td class="n">${bu(r.stored)}</td><td class="n">${bu(r.open)}</td><td class="n">${bu(r.free)}</td><td class="n" style="color:${r.short?'var(--warn)':'inherit'}">${r.short?bu(r.short):'—'}</td></tr>`).join('')}</tbody></table>`
    :`<div class="empty">Add bins and open contracts to compare stored grain against what's committed.</div>`}</div></section>`}

function dynCell(r){
  if(!r.plan||!n0(r.plan.costPerAcre))return'<span class="muted">Add cost per acre</span>';
  if(r.restBu<=0){const m=r.pricedRev-r.totalCost;return`<span class="pill ${m>=0?'good':'bad'}">All priced</span><div class="muted" style="font-size:.74rem">${m>=0?'profit':'loss'} ${usd(Math.abs(m),0)}</div>`}
  if(r.dynBe<=0)return`<span class="pill good">Costs covered</span><div class="muted" style="font-size:.74rem">by sales already priced</div>`;
  const d=r.be!=null?r.dynBe-r.be:0,c=d<-0.005?'var(--good)':d>0.005?'var(--bad)':'var(--muted)';
  return`<b>${usd(r.dynBe)}</b> <span style="color:${c};font-size:.78rem;white-space:nowrap">${Math.abs(d)<0.005?'no change':(d<0?'▼ ':'▲ ')+usd(Math.abs(d))}</span><div class="muted" style="font-size:.74rem">on ${bu(r.restBu)} unpriced bu</div>`}
function tabProduction(f){
  const list=f.crops.filter(c=>+c.year===+S.year),p=position(f,S.year);
  const rowFor=c=>p.find(x=>key(x.crop)===key(c.crop))||{};
  const tot=list.reduce((a,c)=>{const r=rowFor(c);return{ac:a.ac+n0(c.acres),exp:a.exp+(r.expected||0),cost:a.cost+(r.totalCost||0)}},{ac:0,exp:0,cost:0});
  return`<section><div class="sechead"><h2>${S.year} production</h2><div class="sp"></div><button class="primary" data-add="crop">Add crop</button></div>
  <div class="panel tablewrap">${list.length?`<table><thead><tr><th>Crop</th><th class="n">Acres</th><th class="n">APH</th><th class="n">Expected yield</th><th class="n">Expected bu</th><th class="n">Cost / acre</th><th class="n">Break-even</th><th class="n">Priced so far</th><th>Dynamic break-even</th><th></th></tr></thead><tbody>
    ${list.map(c=>{const r=rowFor(c);return`<tr class="click" data-edit="crop" data-id="${c.id}"><td><b>${esc(c.crop)}</b></td><td class="n">${bu(n0(c.acres))}</td><td class="n">${n0(c.aph)}</td>
      <td class="n">${r.yld?r.yld.toLocaleString('en-US',{maximumFractionDigits:1}):'—'}${num(c.expectedYield)==null?'<div class="muted" style="font-size:.72rem">= APH</div>':''}</td><td class="n">${bu(r.expected||0)}</td>
      <td class="n">${usd(num(c.costPerAcre))}</td><td class="n"><b>${usd(r.be)}</b></td>
      <td class="n">${r.pricedBu?`${bu(r.pricedBu)} bu<div class="muted" style="font-size:.74rem">avg ${usd(r.avg)}</div>`:'—'}</td>
      <td>${dynCell(r)}</td><td><button class="small" data-edit="crop" data-id="${c.id}">Edit</button></td></tr>`}).join('')}</tbody>
    <tfoot><tr><td><b>Total</b></td><td class="n"><b>${bu(tot.ac)}</b></td><td></td><td></td><td class="n"><b>${bu(tot.exp)}</b></td><td></td><td></td><td></td><td class="muted" style="font-size:.8rem">Total cost ${usd(tot.cost,0)}</td><td></td></tr></tfoot></table>`
    :`<div class="empty"><b>No ${S.year} crops yet</b>Add each crop's acres, APH, expected yield and cost per acre to calculate break-even.</div>`}</div>
  <div class="explain"><p><b>Break-even</b> = cost per acre ÷ expected yield. This is the average price you need across every bushel to cover costs.</p>
  <p><b>Dynamic break-even</b> updates as you price grain. It is the price you still need on the bushels not yet priced: (total cost − revenue from priced sales) ÷ unpriced bushels. Selling above break-even pulls it down (▼); selling below pushes it up (▲). Put option premiums count as cost. HTA and basis contracts count once both parts of the price are set.</p></div></section>`}
function tabInsurance(f){
  const list=f.crops.filter(c=>+c.year===+S.year),p=position(f,S.year);

      <td class="n">${has?usd(num(c.projPrice)):'—'}</td><td class="n">${c.insType==='RP'?usd(num(c.harvestPrice)):'—'}</td>
      <td class="n">${r.revGuar?`<b>${usd(r.revGuar,0)}</b><div class="muted" style="font-size:.74rem">at ${usd(r.insPrice)}/bu</div>`:'—'}</td>

  <div class="explain"><p><b>Insured bushels</b> = acres × APH × coverage level. Contracting more than this means a short crop could leave contracts you can't fill with insured bushels.</p>
  <p><b>Revenue guarantee</b> = insured bushels × guarantee price. For RP, that is the higher of the projected and harvest price; RP-HPE and YP use the projected price. These are planning estimates, not policy terms.</p></div></section>`}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-add],[data-edit],[data-open],[data-act],[data-sale],[data-sort],[data-by]');if(!t||t.closest('dialog'))return;
  if(t.dataset.tab){S.tab=t.dataset.tab;render();return}
  if(t.dataset.sale){showSale(t.dataset.sale);return}
  if(t.dataset.sort){const k=t.dataset.sort;S.sort=S.sort.k===k?{k,dir:-S.sort.dir}:{k,dir:k==='date'||k==='bu'?-1:1};render();return}
  if(t.dataset.by){S.by=t.dataset.by;render();return}
  if(t.dataset.add){openForm(t.dataset.add);return}
  if(t.dataset.edit){e.stopPropagation();openForm(t.dataset.edit,t.dataset.id);return}
  if(t.dataset.open){S.current=t.dataset.open;S.tab='overview';S.confirmRemove=false;render();return}
  const a=t.dataset.act;
  if(a==='back'){S.current=null;render()}

    S.downloads.save({filename:`grain-desk-snowflake-${TODAY}.zip`,data:makeZip(files)}).then(()=>toast('Snowflake export saved')).catch(e=>{if(e&&e.code!=='declined')toast("Couldn't save the export here.",true)})}
  if(a==='showunpriced'){S.flt.status='unpriced';render()}
  if(a==='export'){const f=S.farms[S.current];const name=(f.name.replace(/[^\w\- ]+/g,'').trim()||'farm')+` ${S.year} sales.csv`;
    S.downloads.save({filename:name,data:csvSales(f)}).then(()=>toast('CSV saved')).catch(e=>{if(e&&e.code!=='declined')toast("Couldn't export the file here.",true)})}
  if(a==='copysum'){const txt=textSummary(S.farms[S.current]);

    try{navigator.clipboard.writeText(txt).then(()=>toast('Summary copied: paste it into an email or notes'),fallback)}catch(err){fallback()}}
  if(a==='addclient')nameDialog('Add a client farm','',name=>{const id='client-'+uid();S.farms[id]=normalize({name});S.current=id;S.tab='overview';persist(id)});
  if(a==='rename')nameDialog('Rename farm',S.farms[S.current].name,name=>{S.farms[S.current].name=name;persist(S.current)});
  if(a==='removefarm'){if(!S.confirmRemove){S.confirmRemove=true;render();return}
    const id=S.current;delete S.farms[id];S.current=null;S.confirmRemove=false;render();
    if(S.mode==='live')S.db.doc('farms/'+id).delete().then(()=>toast('Farm removed')).catch(()=>toast("Couldn't remove that farm. Try again.",true))}
});

function preview(msg){
  S.mode='preview';S.owner=true;S.note=msg;S.farms={'sample':normalize(PREVIEW)};S.current='sample';
  $('#who').textContent='Preview';render()}
async function boot(){
  const c=window.claude;
  if(!c||!c.use)return preview('Preview mode: showing sample data. Changes are not saved here.');
  const [db,user]=await Promise.all([c.use('db'),c.use('user')]);
  c.use('downloads').then(d=>{S.downloads=d;if(d&&!$('#dlg').open)render()});
  if(!db||!user)return preview('Saving is not available in this view, so this shows sample data. Open the shared link while signed in to claude.ai to keep records.');
  S.db=db;S.user=user;S.uid=await user.id();S.owner=await user.isOwner();
  if(!S.uid&&!S.owner){S.mode='noid';render();return}
  S.mode='live';
  const me=await user.me();$('#who').textContent=S.owner?'Consultant · '+(me.name||'you'):(me.name||'');
  const onErr=e=>{if(e&&e.code==='revoked'){S.note='Access to saved records has ended for this page.';render()}};
  if(S.owner){
    db.collection('farms').onSnapshot(snap=>{const next={};snap.docs.forEach(d=>{if(d.exists)next[d.id]=normalize(d.data())});
      S.farms=next;if(S.current&&!next[S.current])S.current=null;if(!$('#dlg').open)render()},onErr);
  }else{
    S.current=S.uid;
    db.doc('farms/'+S.uid).onSnapshot(d=>{if(d.exists)S.farms[S.uid]=normalize(d.data());else delete S.farms[S.uid];if(!$('#dlg').open)render()},onErr);
  }
  render()}
boot();
</script>
